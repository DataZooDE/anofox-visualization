<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>duckplot — SQL dashboards in the browser</title>
<style>
:root{
  --bg:#eef2f8;--card:#fff;--ink:#111827;--muted:#667085;--line:#e6e9f1;
  --accent:#2a9d8f;--accent2:#1f8ca6;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 14px 34px -18px rgba(16,24,40,.18);
  --shadow-hi:0 1px 2px rgba(16,24,40,.05),0 26px 50px -20px rgba(16,24,40,.28);
  --radius:16px;
}
*{box-sizing:border-box}
body{font:15px/1.55 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);margin:0;min-height:100vh;
  background:radial-gradient(1100px 520px at 92% -8%,#e3ecfb 0%,transparent 55%),linear-gradient(180deg,#f4f7fc 0%,#eaeef6 100%);background-attachment:fixed}
/* top loading bar */
#loadbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;pointer-events:none;overflow:hidden}
#loadbar::before{content:"";position:absolute;top:0;height:100%;width:35%;left:-35%;border-radius:3px;background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent)}
body.loading #loadbar::before{animation:dpLoad 1s cubic-bezier(.4,0,.2,1) infinite}
@keyframes dpLoad{to{left:105%}}
header{position:sticky;top:0;z-index:40;padding:.7rem 1.4rem;border-bottom:1px solid var(--line);backdrop-filter:blur(14px) saturate(1.5);background:rgba(255,255,255,.72);display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
header h1{font-size:1.18rem;font-weight:700;margin:0;letter-spacing:-.02em;display:flex;align-items:center;gap:.5rem}
header h1::before{content:"";width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 0 4px rgba(42,157,143,.16),0 2px 8px rgba(31,140,166,.5)}
header .tag{color:var(--muted);font-size:.82rem}
header .actions{margin-left:auto;display:flex;gap:.45rem;align-items:center}
header .status{font-size:.78rem;color:var(--muted);min-width:58px;text-align:right;font-weight:600}
.layout{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:0;min-height:calc(100vh - 57px)}
.editor{border-right:1px solid var(--line);background:rgba(255,255,255,.6);display:flex;flex-direction:column;backdrop-filter:blur(6px)}
.editor .bar{padding:.6rem .8rem;border-bottom:1px solid var(--line);display:flex;gap:.5rem;align-items:center}
.editor textarea{flex:1;border:0;outline:0;resize:none;padding:1rem;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);tab-size:2;background:transparent}
button{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:9px;padding:.5rem .95rem;font-weight:600;font-size:.85rem;cursor:pointer;box-shadow:0 6px 16px -6px rgba(31,140,166,.5);transition:transform .12s ease,box-shadow .12s ease,filter .12s ease}
button:hover{transform:translateY(-1px);filter:brightness(1.06);box-shadow:0 10px 22px -8px rgba(31,140,166,.6)}
button:active{transform:translateY(0)}
button:disabled{opacity:.5;cursor:default;box-shadow:none;transform:none}
.btn2{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 1px 2px rgba(16,24,40,.05)}
.btn2:hover{background:#f6f8fc;filter:none}
select{border:1px solid var(--line);border-radius:9px;padding:.45rem .55rem;font-size:.82rem;background:#fff;color:var(--ink);cursor:pointer;transition:border-color .12s}
select:hover{border-color:#cfd6e4}
header .actions select{padding:.42rem .5rem}
.dl{position:absolute;top:.6rem;right:.65rem;width:28px;height:28px;padding:0;background:rgba(255,255,255,.85);backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:.95rem;line-height:1;box-shadow:none;opacity:0;transform:translateY(-2px);transition:opacity .15s,transform .15s,color .12s}
.panel:hover .dl{opacity:1;transform:none}
.dl:hover{color:var(--accent);border-color:var(--accent)}
.dash{padding:1.5rem 1.7rem;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:1.15rem;align-content:start}
@media(max-width:760px){.grid>.panel{grid-column:1/-1 !important}}
.section{grid-column:1/-1;margin:.7rem 0 -.5rem;font-size:1.15rem;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.controls{grid-column:1/-1;display:flex;gap:1.3rem;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.75rem 1.1rem;box-shadow:var(--shadow)}
.control{font-size:.82rem;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:.45rem}
.control select{font-size:.85rem;color:var(--ink);font-weight:500}
.group{grid-column:1/-1;margin:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem 1.2rem;box-shadow:var(--shadow)}
.group-title{font-weight:700;letter-spacing:-.01em;margin-bottom:.7rem}
.group-body{display:flex;flex-wrap:wrap;gap:1.3rem;align-items:center}
.group-body .panel{flex:1 1 340px;border:0;border-radius:0;padding:0;box-shadow:none}
.group-body .panel:hover{transform:none;box-shadow:none}
.group-body .control{margin:0}
.panel{position:relative;margin:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem 1.2rem;box-shadow:var(--shadow);transition:box-shadow .2s ease,border-color .2s ease}
.panel:hover{box-shadow:var(--shadow-hi);border-color:#dfe4ee}
.panel svg{width:100%;height:auto;display:block}
.panel-title{font-size:.9rem;font-weight:700;letter-spacing:-.01em;color:var(--ink);margin:-.1rem 0 .6rem;padding-bottom:.55rem;border-bottom:1px solid var(--line)}
.group-body .panel .panel-title{border-bottom:0;padding-bottom:.2rem}
.dp-table{width:100%;border-collapse:collapse;font-size:.85rem}
.dp-table th{text-align:left;font-weight:650;color:var(--muted);border-bottom:2px solid var(--line);padding:.5rem .6rem;position:sticky;top:0;background:var(--card);user-select:none}
.dp-table td{padding:.42rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap}
.dp-table tbody tr{transition:background .1s}
.dp-table tbody tr:hover{background:#f5f8fd}
.metric{justify-content:center;overflow:hidden}
.metric-value{font-size:2.5rem;font-weight:800;letter-spacing:-.03em;line-height:1.05;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.metric-cap{color:var(--muted);font-size:.85rem;font-weight:600;margin-top:.3rem}
.metric-delta{font-size:.85rem;font-weight:700;margin-top:.2rem;display:inline-flex;align-items:center;gap:.2rem}
.metric-delta.up{color:#0ca678}.metric-delta.down{color:#e03131}
/* Text cards (::TEXT_SMALL/_MEDIUM/_LARGE) */
.textcard{justify-content:center}
.text-value{font-weight:700;letter-spacing:-.02em;color:var(--ink);line-height:1.25}
.text-small .text-value{font-size:1rem}
.text-medium .text-value{font-size:1.5rem}
.text-large .text-value{font-size:2.2rem;font-weight:800;letter-spacing:-.03em}
/* Trend arrow inside a table cell (::TREND) */
.trend{font-weight:700;font-variant-numeric:tabular-nums}
.trend.up{color:#0ca678}.trend.down{color:#e03131}
/* Placeholder (::PLACEHOLDER) — reserved empty grid cell */
.placeholder{background:transparent;border:1px dashed var(--line);box-shadow:none;min-height:80px}
.placeholder:hover{box-shadow:none;border-color:var(--line)}
/* Header image / footer link */
.header-image{grid-column:1/-1;max-width:100%;max-height:140px;object-fit:contain;border-radius:12px;justify-self:start}
.footer-link{grid-column:1/-1;justify-self:center;color:var(--accent);font-weight:600;font-size:.9rem;text-decoration:none;padding:.4rem 0}
.footer-link:hover{text-decoration:underline}
/* Download button (::DOWNLOAD_*) */
.download-row{justify-content:flex-start}
.dl-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:10px;padding:.55rem 1rem;font-weight:600;font-size:.85rem;cursor:pointer}
@media print{.editor,header .actions,#loadbar,.dl{display:none !important}.layout{display:block !important}body{background:#fff}}
.control select[multiple]{padding:.25rem;min-width:110px;border-radius:9px}
.tabbar{grid-column:1/-1;display:flex;gap:.25rem;border-bottom:1px solid var(--line);margin:.2rem 0 1.15rem}
.tab-btn{background:none;color:var(--muted);border:0;border-bottom:2px solid transparent;border-radius:8px 8px 0 0;padding:.55rem 1rem;font-weight:600;font-size:.9rem;cursor:pointer;box-shadow:none;transition:color .12s,background .12s,border-color .12s}
.tab-btn:hover{color:var(--ink);background:rgba(42,157,143,.06);transform:none;filter:none}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tabpane{margin-bottom:1rem}
.err{grid-column:1/-1;color:#b42318;background:#fef3f2;border:1px solid #fecdca;border-radius:12px;padding:.8rem 1rem;font:13px/1.5 ui-monospace,monospace;white-space:pre-wrap}
.dp-tip{position:fixed;pointer-events:none;background:rgba(17,24,39,.95);backdrop-filter:blur(4px);color:#fff;padding:.4rem .6rem;border-radius:9px;font-size:.8rem;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;transform:translateY(3px) scale(.96);transition:opacity .1s,transform .1s;z-index:50;white-space:nowrap}
.dp-tip.show{opacity:1;transform:none}
.dp-hit{transition:filter .12s}.dp-hit:hover{filter:brightness(1.1) saturate(1.06)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#c4cddd;border-radius:8px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#aab6cc}
/* ---- dark mode: deep shell, light readable chart cards ---- */
body.dark{--bg:#0b1226;--ink:#e8eef8;--muted:#9fb0c9;--line:#242f49;
  background:radial-gradient(1100px 560px at 92% -10%,#182a4f 0%,transparent 55%),linear-gradient(180deg,#0d142b,#0a1124);background-attachment:fixed}
body.dark header{background:rgba(13,20,43,.72);border-color:#232f4a}
body.dark .editor{background:rgba(17,24,46,.55)}
body.dark .editor textarea{color:#e8eef8}
body.dark .btn2{background:#1c2942;color:#e8eef8;border-color:#2b3a58}
body.dark .btn2:hover{background:#243456}
body.dark select,body.dark header .actions select{background:#1c2942;color:#e8eef8;border-color:#2b3a58}
body.dark .section{color:#e8eef8}
body.dark .tab-btn{color:#9fb0c9}
body.dark .tab-btn:hover{color:#e8eef8;background:rgba(255,255,255,.05)}
body.dark .tabbar{border-color:#242f49}
/* cards stay light so charts read; keep their inner text dark */
body.dark .panel,body.dark .group,body.dark .controls{background:#fff;border-color:#e9edf4;color:#1f2937}
body.dark .panel:hover{border-color:#e9edf4;box-shadow:0 1px 2px rgba(0,0,0,.3),0 26px 54px -20px rgba(0,0,0,.6)}
body.dark .group-title{color:#1f2937}
body.dark .panel-title{color:#1f2937;border-color:#e9edf4}
body.dark .metric-cap,body.dark .control,body.dark .dp-table th{color:#667085}
body.dark .dp-table td{color:#1f2937;border-color:#eef1f6}
body.dark .dp-table tbody tr:hover{background:#f5f8fd}
body.dark .control select,body.dark .group .control select{background:#fff;color:#1f2937;border-color:#e6e9f1}
@media(max-width:820px){.layout{grid-template-columns:1fr}.editor{border-right:0;border-bottom:1px solid var(--line)}.editor textarea{min-height:220px}}
</style>
</head>
<body>
<div id="loadbar"></div>
<header>
  <h1>duckplot</h1>
  <span class="tag">SQL dashboards — live DuckDB or DuckDB-Wasm, rendered by ggplot-rs</span>
  <div class="actions">
    <button id="share" class="btn2" title="copy a shareable link (the SQL is encoded in the URL)">Share</button>
    <button id="dlhtml" class="btn2" title="download the dashboard as a standalone HTML file">⤓ HTML</button>
    <select id="refresh" title="auto-refresh interval">
      <option value="0">No refresh</option>
      <option value="5">5s</option>
      <option value="30">30s</option>
      <option value="60">60s</option>
    </select>
    <button id="dark" class="btn2" title="toggle dark mode">🌙</button>
  </div>
  <span class="status" id="status">booting…</span>
</header>
<div class="layout">
  <div class="editor">
    <div class="bar">
      <button id="run" disabled>Run ▸</button>
      <select id="samples" title="load a sample"></select>
      <select id="cols" title="layout columns">
        <option value="auto">Auto cols</option>
        <option value="1">1 column</option>
        <option value="2">2 columns</option>
        <option value="3">3 columns</option>
      </select>
    </div>
    <textarea id="sql" spellcheck="false"></textarea>
  </div>
  <div class="dash">
    <div class="grid" id="grid"></div>
  </div>
</div>
<div id="dp-tip" class="dp-tip"></div>
<script type="module" src="./app.js"></script>
</body>
</html>

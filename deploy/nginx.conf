# nginx in front of locked replicas (docs/deployment.md). Include from the
# http {} block, e.g. /etc/nginx/conf.d/anofox.conf.
upstream anofox {
    # Sticky by client address: a viewer stays on one replica, so its
    # superseded page requests are cancelled there and it reuses that cache.
    hash $remote_addr consistent;
    server 10.0.0.11:8080 max_fails=3 fail_timeout=10s;
    server 10.0.0.12:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name dash.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dash.example.com;
    ssl_certificate     /etc/letsencrypt/live/dash.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dash.example.com/privkey.pem;

    auth_basic "Dashboards";
    auth_basic_user_file /etc/nginx/anofox.htpasswd;

    # The servers' own limit is 64 KiB (max_body_bytes).
    client_max_body_size 64k;

    location / {
        proxy_pass http://anofox;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Forward the Host as the browser sent it (with a non-default port):
        # the replicas check it against "hosts" and compare it with Origin.
        proxy_set_header Host $http_host;
        # Above the servers' timeout_ms.
        proxy_read_timeout 60s;
        # Retry on another replica when one is down. Panel requests are POSTs
        # but read-only, so retrying them is safe (non_idempotent).
        proxy_next_upstream error timeout http_502 http_503 non_idempotent;
    }
}

[package]
name = "tiny_http"
version = "0.12.0"
authors = ["pierre.krieger1708@gmail.com",
           "Corey Farwell <coreyf@rwell.org>"]
description = "Low level HTTP server library"
documentation = "https://tiny-http.github.io/tiny-http/tiny_http/index.html"
keywords = ["http", "server", "web"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tiny-http/tiny-http"
edition = "2018"

# One doc example needs the dev-dependency `rustc-serialize`, which is dropped.
[lib]
doctest = false

[features]
default = []
# anofox-visualization: the TLS features (ssl, ssl-openssl, ssl-rustls) and their
# optional dependencies are removed — we serve plain HTTP only, and keeping them
# would lock rustls 0.20 / ring 0.16 into the workspace Cargo.lock. The cfgs in
# src/ stay as upstream wrote them; see PATCHES.md.

[dependencies]
ascii = "1.0"
chunked_transfer = "1"
log = "0.4.4"
httpdate = "1.0.2"

# Upstream code as published (2022); don't fail the workspace's
# `clippy -D warnings` on lints newer than it. Our patches are written clean.
[lints.rust]
dead_code = "allow"
unused_imports = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("ssl-openssl", "ssl-rustls"))'] }

[lints.clippy]
all = "allow"

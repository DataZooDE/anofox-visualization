[package]
name = "duckplot"
version = "0.1.0"
edition = "2021"
description = "SQL-defined dashboards: Shaper-style column roles rendered to SVG by ggplot-rs. Core is dependency-light and wasm-compatible; DuckDB extension packaging on top."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The rendering engine. No polars — keep the core small and wasm-compatible.
ggplot-rs = { path = "../ggplot-rs", default-features = false, features = ["sf"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }
# `serve` feature (native only): local HTTP server that launches the browser UI
# against a live DuckDB, incl. from the extension later.
tiny_http = { version = "0.12", optional = true }
include_dir = { version = "0.7", optional = true }
open = { version = "5", optional = true }

[features]
default = []
# Browser build (DuckDB-Wasm + duckplot renderer). `wasm-pack build --features wasm`.
wasm = ["dep:wasm-bindgen", "ggplot-rs/wasm"]
# `duckplot serve <db>` — serve the builder UI wired to a live DuckDB.
serve = ["dep:tiny_http", "dep:include_dir", "dep:open"]

[[bin]]
name = "serve"
required-features = ["serve"]

# One workspace, one Cargo.lock (committed; CI builds with --locked). The
# extension crates share the core's version via `version.workspace = true`, so
# this is the single version source of truth (CalVer YYYY.M.D) — see BUILD.md.
[workspace]
members = [".", "duckext", "crates/anofox-viz-ffi", "vendor/tiny_http"]
# `cargo build`/`cargo test` at the root keep meaning "the core crate"; the
# extension crates are built explicitly (-p …), duckext needs libclang (bindgen).
default-members = ["."]
resolver = "2"

[workspace.package]
version = "2026.10.24"
edition = "2021"
license = "BUSL-1.1"

[package]
name = "anofox-visualization"
version.workspace = true
edition = "2021"
description = "SQL-defined dashboards: column-role annotations rendered to SVG by ggplot-rs. Core is dependency-light and wasm-compatible; DuckDB extension packaging on top."
license = "BUSL-1.1"

[lib]
name = "anofox_visualization"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The rendering engine. No polars — keep the core small and wasm-compatible.
# From crates.io (0.17: escaped host attributes, data-domain/series/value,
# fragments, candlestick/radar/gauge/calendar, plus the statistical geoms —
# discrete dodge, flip-safe intervals, mapped reference lines, QQ bands, Cook's
# contours, step ribbons, label repel, PlotGrid; 0.20: arrows via
# `geom_curve`/`geom_segment` `.arrow()`, the `linewidth` aesthetic, hex
# binning in data units (`StatBinHex`/`GeomHex` on a fixed lattice), identity
# colour/fill scales, interactive aesthetics (`Aes::tooltip`, `Aes::data_attr`),
# and `coord_sf` xlim/ylim/expand + `svg_root_data(false)` for overlay
# rendering); 0.21: the SVG mark contract — `class="gg-mark …"` +
# `data-geom`, a NaN-safe `draw_line` split, `fill-opacity`/`stroke-opacity`
# omitted at 1, `svg_attr`/`svg_warnings_attr` root attributes on GGPlot and
# PlotGrid, `svg_formatted_values` + `Scale::format_value`
# (`with_value_formatter`), tooltip templates, geom text inheriting
# `theme.text.family`, and `element_geom` ink/paper/accent (point, line,
# path, text, label, boxplot, smooth — sipemu/ggplot-rs#142 tracks the rest);
# 0.22.2: `GGPlot::decorative()` (no per-mark metadata, `data-part=
# "decorative"`), `with_value_formatter` on the colour/fill gradient scales,
# and `geom_vline`/`geom_hline`/`geom_abline` reading `tooltip()` templates;
# 0.23.0: per-panel dodge/dodge2/jitter group count+offset (#153),
# position_stack/position_fill splitting a group's positive/negative
# values into independent stacks (#154), auto-wrap/grid for every
# simultaneous discrete legend plus PlotGrid collected-legend wrap
# (#155), and a too-tall vertical legend grid reducing columns then
# truncating labels with an ellipsis + `<title>` tooltip before warning
# (#159) — the truncated label is a plain text run, not a `gg-mark`.
# `PositionParams` gained `group_order` (breaking for struct-literal
# builders; we use `..Default::default()`). `guide::legend::draw_legend`
# is deprecated, unused by us.
# 0.24.0: `geom_col()`/`geom_area()` now default to `position_stack()`
# (ggplot2 parity, #169) — plain (non-dodged, non-stacked) bar/area roles
# that can have more than one group at a shared x now set
# `.position(PositionIdentity)` explicitly to keep the old overlap look
# (see `cartesian`'s `Kind::Bar | Kind::BarPercent` and `Kind::Area`
# arms); `position_stack`/`position_fill` also skip a missing y (counts
# as 0) instead of treating it as 0.0 and drawing a real point — no
# effect here, since GeomCol/GeomArea already drop NaN rows before this
# stage. Plus a vertical legend's ncol-reduction panel-width reclaim and
# a bottom/top legend sharing width with a colourbar — neither reachable
# here (no `Left`/`Right` legend, no simultaneous colourbar + discrete
# guide on one plot).
# For local ggplot-rs work, `[patch.crates-io]` it to a path.
ggplot-rs = { version = "0.28.2", default-features = false, features = ["sf"] }
serde_json = { version = "1", features = ["preserve_order"] }
wasm-bindgen = { version = "0.2", optional = true }
# `serve` feature (native only): local HTTP server that launches the browser UI
# against a live DuckDB, incl. from the extension later.
tiny_http = { version = "0.12", optional = true }
include_dir = { version = "0.7", optional = true }
open = { version = "5", optional = true }
# `auth` feature (native only, part of `serve`; the extension enables it):
# built-in login — JWT/OIDC, signed embed links, API keys (src/host/auth/).
# One crypto backend, aws-lc-rs: JWT signatures (jsonwebtoken), HMAC/SHA-256
# and randomness, and TLS for the JWKS/OIDC fetches (rustls through ureq).
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"], optional = true }
aws-lc-rs = { version = "1", features = ["prebuilt-nasm"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"], optional = true }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"], optional = true }
base64 = { version = "0.22", optional = true }

# The request log opens its file with O_NOFOLLOW (src/host/access.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
# Browser build (DuckDB-Wasm + the renderer). `wasm-pack build --features wasm`.
wasm = ["dep:wasm-bindgen"]
# `anofox-visualization serve <db>` — serve the builder UI wired to a live DuckDB.
serve = ["dep:tiny_http", "dep:include_dir", "dep:open", "auth"]
# Built-in authentication for the dashboard servers (no HTTP server of its own).
auth = ["dep:jsonwebtoken", "dep:aws-lc-rs", "dep:rustls", "dep:ureq", "dep:base64"]

[[bin]]
name = "serve"
required-features = ["serve"]

[dev-dependencies]
# Tests parse every rendered SVG as XML (well-formedness + XSS checks).
roxmltree = "0.21"

# tiny_http 0.12.0 with a lost wake-up fix in its worker pool (#86) and the
# security fixes backported from tiny_http_dh 0.12.2. Every crate in the
# workspace (core `serve`, the DuckDB extension, the FFI build) picks it up.
# What changed and why: vendor/tiny_http/PATCHES.md.
[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }

# The wasm build only (web/pkg, `wasm-pack build --profile wasm …`, #312).
# Separate from [profile.release] (native DuckDB extension + the `serve`/
# `dashboard` binaries), which is NOT touched here and stays Cargo's defaults.
# Without this, wasm-pack's default profile (opt-level 3, no LTO, 16 codegen
# units) made per-PR wasm size deltas mostly codegen noise (±20-40 K, functions
# get reshuffled across codegen units by unrelated changes) — see
# ~/projects/duckdb/wasm-size-m2.md. Fat LTO + one codegen unit alone removes
# most of that noise; opt-level "z" was then chosen over the default 3 and
# over "s" from a 3-way raw/gzip size vs. browser render-time measurement
# (showcase + delivery-coverage dashboards, Playwright, 5 runs each): "z" is
# the smallest (-34.5% raw / -29.1% gzip vs. opt 3) and showed no render-time
# regression on either dashboard.
[profile.wasm]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = "z"

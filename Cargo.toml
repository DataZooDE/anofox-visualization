# One workspace, one Cargo.lock (committed; CI builds with --locked). The
# extension crates share the core's version via `version.workspace = true`, so
# this is the single version source of truth (CalVer YYYY.M.D) — see BUILD.md.
[workspace]
members = [".", "duckext", "crates/anofox-viz-ffi", "vendor/tiny_http"]
# `cargo build`/`cargo test` at the root keep meaning "the core crate"; the
# extension crates are built explicitly (-p …), duckext needs libclang (bindgen).
default-members = ["."]
resolver = "2"

[workspace.package]
version = "2026.10.29"
edition = "2021"
license = "BUSL-1.1"

[package]
name = "anofox-visualization"
version.workspace = true
edition = "2021"
description = "SQL-defined dashboards: column-role annotations rendered to SVG by ggplot-rs. Core is dependency-light and wasm-compatible; DuckDB extension packaging on top."
license = "BUSL-1.1"

[lib]
name = "anofox_visualization"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The rendering engine. No polars — keep the core small and wasm-compatible.
# From crates.io (0.17: escaped host attributes, data-domain/series/value,
# fragments, candlestick/radar/gauge/calendar, plus the statistical geoms —
# discrete dodge, flip-safe intervals, mapped reference lines, QQ bands, Cook's
# contours, step ribbons, label repel, PlotGrid; 0.20: arrows via
# `geom_curve`/`geom_segment` `.arrow()`, the `linewidth` aesthetic, hex
# binning in data units (`StatBinHex`/`GeomHex` on a fixed lattice), identity
# colour/fill scales, interactive aesthetics (`Aes::tooltip`, `Aes::data_attr`),
# and `coord_sf` xlim/ylim/expand + `svg_root_data(false)` for overlay
# rendering); 0.21: the SVG mark contract — `class="gg-mark …"` +
# `data-geom`, a NaN-safe `draw_line` split, `fill-opacity`/`stroke-opacity`
# omitted at 1, `svg_attr`/`svg_warnings_attr` root attributes on GGPlot and
# PlotGrid, `svg_formatted_values` + `Scale::format_value`
# (`with_value_formatter`), tooltip templates, geom text inheriting
# `theme.text.family`, and `element_geom` ink/paper/accent (point, line,
# path, text, label, boxplot, smooth — sipemu/ggplot-rs#142 tracks the rest);
# 0.22.2: `GGPlot::decorative()` (no per-mark metadata, `data-part=
# "decorative"`), `with_value_formatter` on the colour/fill gradient scales,
# and `geom_vline`/`geom_hline`/`geom_abline` reading `tooltip()` templates;
# 0.23.0: per-panel dodge/dodge2/jitter group count+offset (#153),
# position_stack/position_fill splitting a group's positive/negative
# values into independent stacks (#154), auto-wrap/grid for every
# simultaneous discrete legend plus PlotGrid collected-legend wrap
# (#155), and a too-tall vertical legend grid reducing columns then
# truncating labels with an ellipsis + `<title>` tooltip before warning
# (#159) — the truncated label is a plain text run, not a `gg-mark`.
# `PositionParams` gained `group_order` (breaking for struct-literal
# builders; we use `..Default::default()`). `guide::legend::draw_legend`
# is deprecated, unused by us.
# 0.24.0: `geom_col()`/`geom_area()` now default to `position_stack()`
# (ggplot2 parity, #169) — plain (non-dodged, non-stacked) bar/area roles
# that can have more than one group at a shared x now set
# `.position(PositionIdentity)` explicitly to keep the old overlap look
# (see `cartesian`'s `Kind::Bar | Kind::BarPercent` and `Kind::Area`
# arms); `position_stack`/`position_fill` also skip a missing y (counts
# as 0) instead of treating it as 0.0 and drawing a real point — no
# effect here, since GeomCol/GeomArea already drop NaN rows before this
# stage. Plus a vertical legend's ncol-reduction panel-width reclaim and
# a bottom/top legend sharing width with a colourbar — neither reachable
# here (no `Left`/`Right` legend, no simultaneous colourbar + discrete
# guide on one plot).
# 0.31.1: `GGPlot::svg_title`/`svg_desc` — an accessible name/description
# written onto the root `<svg>` (`<title>`/`<desc>`, `role="img"` +
# `aria-labelledby`/`-describedby`), used by `map/plot.rs` to restore the
# `<desc>{summary}</desc>` the old hand-written map writer had before #498
# (sipemu/ggplot-rs#255, #510); a continuous colourbar at
# `LegendPosition::Top`/`Bottom` now draws horizontally instead of being
# clipped (sipemu/ggplot-rs#211) — used by `render_heatmap`/
# `render_calendar`/`cartesian`'s hexbin branch to put a narrow panel's
# gradient legend at `Bottom` instead of ggplot-rs's own `Right` default
# (`narrow_continuous_legend`, #510). 0.31.2: `GGPlot::bivariate_legend_counts`
# — a `::BIVARIATE` map's legend swatches with each cell's row count
# (sipemu/ggplot-rs#259, #506's bivariate choropleths); also adds
# `GeomAttribution::fit`/`.fit_overflow(..)`, tuned further in 0.31.3
# (sipemu/ggplot-rs#264: a safety margin on the width estimate, and
# separator-aware wrapping for a bare URL instead of char-slicing it) — NOT
# adopted by `map/plot.rs` in #510: both `AttributionOverflow` kinds still
# mis-measure/mis-split this map's own BKG source line at a narrow width
# (confirmed with PNG crops — `Wrap` only splits at the one inter-run space
# between its URL run and the trailing plain-text note, leaving the URL run
# itself unbroken; `Ellipsis`'s truncation budget is still a bit too
# generous for that character mix and the kept text overflows the panel).
# `map/plot.rs` keeps its existing 90px legend-width reservation instead —
# tracked as a ggplot-rs follow-up (wrap within one run + a tighter width
# estimate for URL-heavy text), not blocking this bump. 0.31.4:
# `AttributionOverflow::Wrap` now splits *inside* a run (not just between
# runs) and both `Wrap`/`Ellipsis` keep each kept/split piece's `href`
# (sipemu/ggplot-rs#267/#268) — the exact gap 0.31.3 above left open, so
# `map/plot.rs` now adopts `.fit(7.0)`/`.fit_overflow(Wrap)` and drops the
# 90px reservation (#546). Also adds `GeomAttribution::fit_width_scale`, an
# opt-in multiplier on `fit`'s width estimate for a caller whose deployed
# rendering measures wider than the heuristic; not used here — measuring
# `foot_of`'s own BKG/EuroGeographics/Natural-Earth rows with `ab_glyph`
# against real DejaVu Sans and Noto Sans glyph metrics (this box's two
# installed fonts, Noto being rsvg's fallback without Hanken Grotesk
# installed) found both render *narrower* than `text_width`'s heuristic
# at every row (DejaVu up to ~0.99x, Noto up to ~0.79x) — the heuristic's
# existing margin already covers both, same conclusion sipemu/ggplot-rs#268
# reached measuring DejaVu + Hanken Grotesk itself. No API breaks in any of
# 0.31.1-0.31.4 (cargo-semver-checks against the prior release each time).
# 0.31.5 (sipemu/ggplot-rs#273, filed from this crate's own #546/#549): adds
# a shared corner layout (`render::corner_layout`) so `GeomAttribution`,
# `GeomAnnotationScale` and `GeomBivariateLegend` each measure their own box
# and stack clear of whatever another one of them already claimed in the
# same render pass, instead of drawing independently into the same corner
# rect — `map/plot.rs` drops the `Foot::wrap_likely`-gated scale-bar corner
# swap this crate had added as a workaround (#546) now that the library
# does the clearing itself; confirmed with PNG crops. Also: a bottom-
# anchored attribution's own wrapped physical lines now read top to bottom
# (previously the opposite, upside down); `GeomBivariateLegend`'s x/y
# captions now fit the grid's own width/height (wrap, then shrink, then
# ellipsise — same fallback `GeomAttribution::fit` uses) instead of
# growing the box to fit themselves; its rotated y caption now reads
# bottom-to-top, matching the axis-title convention. No API breaks
# (cargo-semver-checks against 0.31.4).
# 0.31.6 (sipemu/ggplot-rs#277, #279): a continuous size/legend-width
# colourbar/legend anchored `Top`/`Bottom` now wraps its entries to the
# panel width instead of overflowing it (#277, this crate's own #545 —
# `supply-chain.sql`'s flow legend at 390px no longer overflows); and a
# titled `Top` colourbar's own title no longer collides with the plot's
# title/subtitle above it (#279, this crate's own #577 —
# `delivery-coverage.sql`'s "Week by week" time-map subtitle no longer
# overlaps the legend title at 390px). Both confirmed with PNG crops. No
# API breaks (cargo-semver-checks against 0.31.5).
# 0.31.7 (sipemu/ggplot-rs#281, this crate's own #595): a `Top`
# discrete/binned-fill legend's own band no longer clamps a `.subtitle()`
# (no `.title()`) down into it — `::FRAME` time maps (a classed/binned
# fill, Top legend, the frame label in `.subtitle()`, no title) no longer
# overlap the subtitle with the legend. Confirmed with PNG crops. No API
# breaks (cargo-semver-checks against 0.31.6).
# 0.31.8 (sipemu/ggplot-rs#287): `legend_bottom_when_narrow` (#635).
# 0.32.0 (sipemu/ggplot-rs#290, this crate's own #631): `GeomPoint::
# visibility` — line/area markers on a dense series are drawn uninked but
# stay hover/click targets (`::POINTS`). Breaking only for `GeomPoint`
# struct literals without `..Default::default()` (all fixed here).
# 0.34.0 (#698): `interpolate` on GeomLine/GeomArea/GeomRibbon (breaking for
# struct literals without `..Default::default()`, fixed here); date labels on
# automatic month/year breaks (#640), `legend_inside_auto` (#666),
# `facet_levels`, `PlotGrid::legend_bottom_when_narrow`. wasm +34 KB.
# For local ggplot-rs work, `[patch.crates-io]` it to a path.
ggplot-rs = { version = "0.35.1", default-features = false, features = ["sf"] }
serde_json = { version = "1", features = ["preserve_order"] }
wasm-bindgen = { version = "0.2", optional = true }
# `serve` feature (native only): local HTTP server that launches the browser UI
# against a live DuckDB, incl. from the extension later.
tiny_http = { version = "0.12", optional = true }
include_dir = { version = "0.7", optional = true }
open = { version = "5", optional = true }
# `auth` feature (native only, part of `serve`; the extension enables it):
# built-in login — JWT/OIDC, signed embed links, API keys (src/host/auth/).
# One crypto backend, aws-lc-rs: JWT signatures (jsonwebtoken), HMAC/SHA-256
# and randomness, and TLS for the JWKS/OIDC fetches (rustls through ureq).
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"], optional = true }
aws-lc-rs = { version = "1", features = ["prebuilt-nasm"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"], optional = true }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"], optional = true }
base64 = { version = "0.22", optional = true }

# The request log opens its file with O_NOFOLLOW (src/host/access.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `--site`'s active-SVG check (src/bin/dashboard.rs::svg_active_reason,
# review of #554 B1): parses every published assets/ SVG as XML rather
# than scanning its text, so a namespace-prefixed <x:script> (bound to the
# SVG namespace under a different prefix) or a foreign-namespace element
# (<h:script>/<h:iframe> under the XHTML namespace) can't hide from a
# literal "<script"/"<foreignobject" match. Lives only in `src/bin/
# dashboard.rs`, which the wasm `--lib` build never compiles — review of
# #554's second re-review: gated to non-wasm targets anyway, rather than
# relying on dead-code elimination to keep it out of `web/pkg`, so the
# wasm build doesn't even compile the crate. The `[dev-dependencies]`
# entry below covers the one other user, `src/diagram.rs`'s `#[cfg(test)]`
# code (tests that parse a rendered SVG as XML), for every target.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
roxmltree = "0.21"

[dev-dependencies]
roxmltree = "0.21"

[features]
default = []
# Browser build (DuckDB-Wasm + the renderer). `wasm-pack build --features wasm`.
wasm = ["dep:wasm-bindgen"]
# `anofox-visualization serve <db>` — serve the builder UI wired to a live DuckDB.
serve = ["dep:tiny_http", "dep:include_dir", "dep:open", "auth"]
# Built-in authentication for the dashboard servers (no HTTP server of its own).
auth = ["dep:jsonwebtoken", "dep:aws-lc-rs", "dep:rustls", "dep:ureq", "dep:base64"]

[[bin]]
name = "serve"
required-features = ["serve"]

# tiny_http 0.12.0 with a lost wake-up fix in its worker pool (#86) and the
# security fixes backported from tiny_http_dh 0.12.2. Every crate in the
# workspace (core `serve`, the DuckDB extension, the FFI build) picks it up.
# What changed and why: vendor/tiny_http/PATCHES.md.
[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }

# The wasm build only (web/pkg, `wasm-pack build --profile wasm …`, #312).
# Separate from [profile.release] (native DuckDB extension + the `serve`/
# `dashboard` binaries), which is NOT touched here and stays Cargo's defaults.
# Without this, wasm-pack's default profile (opt-level 3, no LTO, 16 codegen
# units) made per-PR wasm size deltas mostly codegen noise (±20-40 K, functions
# get reshuffled across codegen units by unrelated changes) — see
# ~/projects/duckdb/wasm-size-m2.md. Fat LTO + one codegen unit alone removes
# most of that noise; opt-level "z" was then chosen over the default 3 and
# over "s" from a 3-way raw/gzip size vs. browser render-time measurement
# (showcase + delivery-coverage dashboards, Playwright, 5 runs each): "z" is
# the smallest (-34.5% raw / -29.1% gzip vs. opt 3) and showed no render-time
# regression on either dashboard.
[profile.wasm]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = "z"

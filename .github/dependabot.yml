# #766: dependency updates, grouped (one PR per ecosystem and run) and only
# for releases at least 7 days old — a cooldown against a compromised
# release being pulled in on its first day. Monthly for crates and npm, to
# keep CI time down; weekly for the (SHA-pinned) actions.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      crates:
        patterns: ["*"]
    # #784: held. bindgen 0.73 doesn't build here (its syn requirement);
    # resvg/usvg must stay on the usvg that svg2pdf uses (0.13 → usvg 0.45).
    ignore:
      - dependency-name: bindgen
        update-types: ["version-update:semver-minor"]
      - dependency-name: resvg
        update-types: ["version-update:semver-minor"]
      - dependency-name: usvg
        update-types: ["version-update:semver-minor"]
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /tests/web
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
    # #784: held. DuckDB-Wasm's version is pinned in web/app.js,
    # web/assist-csp.js and src/host/serving.rs and decides the DuckDB the
    # wasm extension is built for — it moves by hand, with them.
    ignore:
      - dependency-name: "@duckdb/duckdb-wasm"
    open-pull-requests-limit: 2

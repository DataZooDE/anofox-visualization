# The live evals of the assistant (#845 M3-3, plan-ai-assistant.md §6 / §11.5)
# and of Ask (#195, §12.9), against the real Anthropic API. Manual only: they
# cost money (about $9–10 for the assistant's 32 prompts on Sonnet 5, about
# $1.50 for Ask's 15 cases on both targets) and use the owner's dedicated key
# (secret ASSIST_EVAL_ANTHROPIC_API_KEY, a workspace key with a monthly limit).
# #854: or another provider — any OpenAI-compatible endpoint (Gemini,
# GitHub Models, a gateway): `endpoint` + `model`, its key in the secret
# ASSIST_EVAL_OPENAI_COMPAT_API_KEY; the judge stays Claude unless `judge` is
# "endpoint" (one fixed judge keeps providers comparable).
# Never on a pull request or a schedule. The results are uploaded as an
# artifact; a pull request copies the assistant's into
# tests/assist-eval/results/latest/ (what CI rechecks and replays for free).
name: assist-eval

on:
  workflow_dispatch:
    inputs:
      eval:
        description: "Which eval: assist, ask or both"
        type: choice
        options: [assist, ask, both]
        default: assist
      model:
        description: "The model (claude-sonnet-5, claude-opus-5-5, claude-haiku-4-5; with an endpoint its own id, e.g. gemini-2.5-pro, openai/gpt-4.1)"
        type: string
        default: claude-sonnet-5
      endpoint:
        description: "An OpenAI-compatible base URL instead of Claude (empty: Claude), e.g. https://generativelanguage.googleapis.com/v1beta/openai or https://models.github.ai/inference"
        type: string
        default: ""
      judge:
        description: "Who grades: claude, or the endpoint (judge_model)"
        type: choice
        options: [claude, endpoint]
        default: claude
      judge_model:
        description: "The judge's model on the endpoint (judge: endpoint only)"
        type: string
        default: ""
      case:
        description: "One case id only (empty: all)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: assist-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATAZOO_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: wasm-pack

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Build the wasm package (web/pkg)
        run: wasm-pack build --target web --out-dir web/pkg --profile wasm --no-default-features --features wasm

      - name: Install DuckDB-Wasm and Playwright (tests/web)
        run: npm install --prefix tests/web --no-audit --no-fund

      # Ask only: its server target needs the CLI and the extension, its
      # builder target a browser.
      - name: Install DuckDB CLI (pinned)
        if: inputs.eval != 'assist'
        run: |
          d="$HOME/.local/duckdb-1.5.6"
          mkdir -p "$d"
          curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip -d "$d"
          chmod +x "$d/duckdb"
          echo "$d" >> "$GITHUB_PATH"
      - name: Build the extension
        if: inputs.eval != 'assist'
        run: SKIP_WASM=1 OUT="$RUNNER_TEMP/anofox_visualization.duckdb_extension" duckext/scripts/build-native.sh
      - name: Install Playwright's Chromium
        if: inputs.eval != 'assist'
        working-directory: tests/web
        run: npx playwright install --with-deps chromium

      - name: The assistant's eval (32 prompts, judged)
        if: inputs.eval != 'ask'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ASSIST_EVAL_ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.ASSIST_EVAL_OPENAI_COMPAT_API_KEY }}
          MODEL: ${{ inputs.model }}
          CASE: ${{ inputs.case }}
          ENDPOINT: ${{ inputs.endpoint }}
          JUDGE: ${{ inputs.judge }}
          JUDGE_MODEL: ${{ inputs.judge_model }}
        run: |
          judge=()
          if [ "$JUDGE" = endpoint ]; then judge=(--judge-endpoint "$ENDPOINT" --judge-model "$JUDGE_MODEL"); fi
          node scripts/assist-eval.mjs --yes --model "$MODEL" ${CASE:+--case "$CASE"} ${ENDPOINT:+--endpoint "$ENDPOINT"} "${judge[@]}" --out "$RUNNER_TEMP/eval/assist"

      - name: Ask's eval (30 cases, server + builder)
        if: inputs.eval != 'assist'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ASSIST_EVAL_ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.ASSIST_EVAL_OPENAI_COMPAT_API_KEY }}
          MODEL: ${{ inputs.model }}
          CASE: ${{ inputs.case }}
          ENDPOINT: ${{ inputs.endpoint }}
          JUDGE: ${{ inputs.judge }}
          JUDGE_MODEL: ${{ inputs.judge_model }}
        run: |
          judge=()
          if [ "$JUDGE" = endpoint ]; then judge=(--judge-endpoint "$ENDPOINT" --judge-model "$JUDGE_MODEL"); fi
          NODE_PATH="$PWD/tests/web/node_modules" TMPDIR="$RUNNER_TEMP" node scripts/ask-eval.mjs --yes --model "$MODEL" \
            ${CASE:+--case "$CASE"} ${ENDPOINT:+--endpoint "$ENDPOINT"} "${judge[@]}" \
            --ext "$RUNNER_TEMP/anofox_visualization.duckdb_extension" --out "$RUNNER_TEMP/eval/ask"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-${{ inputs.eval }}-${{ github.run_id }}
          path: ${{ runner.temp }}/eval
          if-no-files-found: warn
          retention-days: 30

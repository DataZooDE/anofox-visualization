name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: anofox_visualization
      enable_rust: true
      # Render-only, native builds. Windows + wasm are out of scope for now
      # (wasm needs the C++ shell + Rust to build for emscripten; Windows is not
      # shipped — see anofox-statistics for the same exclusions).
      exclude_archs: "windows_amd64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads"

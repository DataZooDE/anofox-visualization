name: Main Extension Distribution Pipeline

# #464: the cross-platform extension builds here are full-lane only — they
# don't gate a normal PR's fast lane. `pull_request` still triggers (so a
# `full-ci` label or a push to the PR branch re-evaluates the lane), but the
# build jobs are gated on lane.yml's `full` output: push to master, a tag,
# workflow_dispatch, the nightly schedule, a release/* branch, or a PR
# labelled `full-ci`.
on:
  push:
    branches: [master]
    tags: ['**', '!wasm-ext-*']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  # See ci.yml's concurrency group for why: a spurious labeled/unlabeled run
  # (one whose `lane` job skips below, #491) gets its own, never-colliding
  # group (a run_id suffix) instead of the shared one, so it can't cancel
  # the real run it shares a ref with — cancel-in-progress applies before
  # any job's `if` is evaluated.
  group: "${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ (github.event_name == 'pull_request' && contains(fromJson('[\"labeled\",\"unlabeled\"]'), github.event.action) && github.event.label.name != 'full-ci') && github.run_id || '' }}"
  cancel-in-progress: true

jobs:
  # See ci.yml's `lane` job for why: opening a PR with a label already
  # attached fires `opened` + `labeled` together (#491), so only re-run the
  # lane decision on labeled/unlabeled when the label is `full-ci` itself.
  lane:
    if: >-
      github.event_name != 'pull_request' ||
      !contains(fromJson('["labeled","unlabeled"]'), github.event.action) ||
      github.event.label.name == 'full-ci'
    uses: ./.github/workflows/lane.yml

  duckdb-stable-build:
    name: Build extension binaries
    needs: lane
    if: needs.lane.outputs.full == 'true'
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: anofox_visualization
      enable_rust: true
      # Render-only, native builds. This extension has NO vcpkg deps (no OpenSSL),
      # so anofox-statistics' mingw OpenSSL/MSYS2 blocker doesn't apply — trying
      # windows_amd64 (MSVC). mingw stays excluded (flaky Rust GNU toolchain) and
      # wasm is out of scope (needs the C++ shell + Rust built for emscripten).
      exclude_archs: "windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads"

  # #352: DuckDB 2.0 LTS shipped 2026-10-21; the community-extensions repo now
  # builds every PR against v2.0.0 by default (a v1.5.6 build needs the
  # separate `variegata` field, see duckext/DISTRIBUTING.md). Our own release
  # pin (`.duckdb-version`) stays at v1.5.6 until ~2.0.1 (owner decision), so
  # this job tells us as soon as csrc/ or CMakeLists.txt stop compiling
  # against 2.0 — but non-blocking: `continue-on-error` is not a valid key on
  # a job that calls a reusable workflow (GitHub Actions rejects the whole
  # file with it), so "non-blocking for now" here means this job is simply
  # not added as a required status check in branch protection, not that it
  # soft-fails on its own. Drops osx_amd64, which the community repo itself
  # has dropped for 2.0.
  duckdb-2-0-build:
    name: Build extension binaries (DuckDB 2.0, non-blocking)
    needs: lane
    if: needs.lane.outputs.full == 'true'
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: anofox_visualization
      enable_rust: true
      exclude_archs: "windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads;osx_amd64"

  forecast-conformance:
    # Every anofox-forecast producer (a curated registry: the extension does
    # not tag its functions) → anofox_plot(...) and its specific macro, on the
    # C-API build, against the community release and the main build from
    # get.erpl.io. DuckDB is pinned to v1.5.6.
    # #464: full lane only (live network install, see statistics-conformance).
    name: anofox-forecast conformance (${{ matrix.repo }})
    needs: lane
    if: needs.lane.outputs.full == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      DATAZOO_DISABLE_TELEMETRY: "1"
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        repo: [community, get.erpl.io]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install DuckDB CLI v1.5.6
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/duckdb"
          "$HOME/.local/bin/duckdb" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install anofox_forecast from ${{ matrix.repo }}
        run: |
          if [ "${{ matrix.repo }}" = community ]; then
            src="community"
          else
            src="'https://${{ matrix.repo }}'"
          fi
          for i in 1 2 3; do
            duckdb -unsigned -c "FORCE INSTALL anofox_forecast FROM $src" && break
            echo "install attempt $i failed; retrying"; sleep 10
          done
          duckdb -unsigned -c "LOAD anofox_forecast;
            SELECT extension_version, installed_from FROM duckdb_extensions() WHERE extension_name = 'anofox_forecast';"

      - name: Build the C-API extension
        run: SKIP_WASM=1 OUT="$RUNNER_TEMP/anofox_visualization.duckdb_extension" duckext/scripts/build-native.sh --release

      - name: Conformance (every producer → anofox_plot + specific macro)
        run: |
          python3 scripts/forecast_conformance.py --duckdb duckdb \
            --ext "$RUNNER_TEMP/anofox_visualization.duckdb_extension" \
            --out "$RUNNER_TEMP/forecast-conformance" --jobs 4 --no-montage

      - name: Upload the SVGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-conformance-svgs-${{ matrix.repo }}
          path: ${{ runner.temp }}/forecast-conformance
          if-no-files-found: ignore

  skills-sql:
    # Every ```sql block of the Claude Code plugin's skills
    # (plugins/anofox-visualization/skills/*/SKILL.md) runs against the C-API
    # build: plain blocks in a fresh DuckDB process, ```sql dashboard blocks
    # through `dashboard --check --strict`, ```sql skip blocks not at all.
    # Blocks that LOAD anofox_statistics / anofox_forecast get them from
    # get.erpl.io / the community repository (DuckDB v1.5.6).
    # #464: full lane only (live network installs, a --release build, and
    # not part of the fast-lane job list).
    name: Claude Code skills SQL
    needs: lane
    if: needs.lane.outputs.full == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install DuckDB CLI v1.5.6
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/duckdb"
          "$HOME/.local/bin/duckdb" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the C-API extension and the dashboard CLI
        run: |
          SKIP_WASM=1 OUT="$RUNNER_TEMP/anofox_visualization.duckdb_extension" duckext/scripts/build-native.sh --release
          cargo build --locked --release --bin dashboard

      - name: Validate the skills' SQL
        run: |
          python3 scripts/validate_skills_sql.py --duckdb duckdb \
            --ext "$RUNNER_TEMP/anofox_visualization.duckdb_extension" \
            --dashboard target/release/dashboard \
            --workdir "$RUNNER_TEMP/skills-sql" --jobs 4

  quack-source:
    # #352 prototype, not yet security-reviewed: options.source builds a
    # locked server's snapshot from a live DuckDB 2.0 Quack source.
    # duckext/scripts/test-quack-source.sh (end-to-end + the security pass:
    # dashboard SQL reaching for Quack/getenv/duckdb_secrets()/
    # duckdb_databases() is refused, the token never leaks, quack is never
    # loaded into the serving instance). Needs a DuckDB 2.0 host — unlike
    # every other job here, which targets the pinned 1.5.6 — so it is kept
    # non-blocking (continue-on-error) until that review lands.
    # #464: full lane only (non-blocking + a live network DuckDB 2.0 host).
    name: Quack source (DuckDB 2.0 host, non-blocking prototype, #352)
    needs: lane
    if: needs.lane.outputs.full == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install DuckDB 2.0 CLI
        run: |
          d="$HOME/.local/duckdb-2.0.0"
          mkdir -p "$d"
          curl -fsSL --retry 3 -o duckdb2.tar.gz https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-cli-linux-amd64.tar.gz
          tar -xzf duckdb2.tar.gz -C "$d"
          chmod +x "$d/duckdb"
          "$d/duckdb" --version
          echo "DUCKDB2=$d/duckdb" >> "$GITHUB_ENV"

      # build-native.sh's own smoke test needs A DuckDB CLI too (any version
      # works for that — it only loads the extension and runs a plot), and
      # defaults to ~/.local/bin/duckdb when $DUCKDB isn't set. The pinned
      # 1.5.6 CLI the main CI job already installs is the obvious one to
      # reuse here; exporting $DUCKDB (build-native.sh's own override) is
      # simpler than relying on PATH resolution order against DUCKDB2.
      - name: Cache DuckDB CLI (pinned, for build-native.sh's smoke test)
        uses: actions/cache@v4
        with:
          path: ~/.local/duckdb-1.5.6
          key: duckdb-cli-1.5.6-linux-amd64

      - name: Install DuckDB CLI (pinned, for build-native.sh's smoke test)
        run: |
          d="$HOME/.local/duckdb-1.5.6"
          if [ ! -x "$d/duckdb" ]; then
            mkdir -p "$d"
            curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
            unzip -q duckdb.zip -d "$d"
            chmod +x "$d/duckdb"
          fi
          "$d/duckdb" --version
          echo "DUCKDB=$d/duckdb" >> "$GITHUB_ENV"

      - name: Build the native extension (runs fine on a 1.5.6-targeted Rust build; only the host needs to be 2.0)
        run: SKIP_WASM=1 OUT="$RUNNER_TEMP/anofox_visualization.duckdb_extension" duckext/scripts/build-native.sh

      - name: Install quack (a repository extension; only reachable from the 2.0 host)
        run: $DUCKDB2 -c "INSTALL quack; LOAD quack;"

      - name: Quack source end to end + security (test-quack-source.sh)
        run: duckext/scripts/test-quack-source.sh "$RUNNER_TEMP/anofox_visualization.duckdb_extension"

  ci-gate:
    # The one stable "mergeable" check (#464): passes when every needed job
    # succeeded or was skipped. A docs-only PR skips everything except
    # `lane` and `docs-check`, so it still resolves with every reported
    # check passed or skipped — nothing left pending forever.
    name: ci-gate
    if: ${{ !cancelled() }}  # not always(): a cancelled (superseded) run must not wait for a runner just to report
    needs:
      - lane
      - docs-check
      - rust
      - sqllogictest
      - duckdb-2-0-smoke
      - web-build
      - web-mjs-shard
      - web-e2e
      - web-explore-starters
      - statistics-conformance
      - optimize-conformance
      - decide-conformance
      - tabular-conformance
      - forecast-conformance
      - skills-sql
      - quack-source
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq .
          bad=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::not mergeable — failed or cancelled jobs:"
            echo "$bad"
            exit 1
          fi
          echo "all needed jobs succeeded or were skipped"

  master-red:
    # Safety net (#464): a failed full-lane run on master or the nightly
    # schedule opens (or comments on) an issue labelled `ci-master-red`,
    # instead of a red run on master going unnoticed until the next person
    # looks at Actions.
    name: file ci-master-red on a failed full-lane master/nightly run
    if: >-
      failure() &&
      needs.lane.outputs.full == 'true' &&
      (github.ref == 'refs/heads/master' || github.event_name == 'schedule')
    needs:
      - lane
      - rust
      - sqllogictest
      - duckdb-2-0-smoke
      - web-build
      - web-mjs-shard
      - web-e2e
      - web-explore-starters
      - statistics-conformance
      - optimize-conformance
      - decide-conformance
      - tabular-conformance
      - forecast-conformance
      - skills-sql
      - quack-source
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or comment on the ci-master-red issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          existing=$(gh issue list --label ci-master-red --state open --json number --jq '.[0].number' || true)
          body="CI failed on the full lane for ${SHA} (${{ github.event_name }}): ${RUN_URL}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "CI red on master" --label ci-master-red --body "$body"
          fi

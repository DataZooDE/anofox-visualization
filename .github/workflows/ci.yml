name: CI

# Rust checks for the whole workspace (core, crates/anofox-viz-ffi, duckext).
# The C++ extension's sqllogictests (test/sql) run in
# MainDistributionPipeline.yml via extension-ci-tools (`make test`).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # anofox extensions send usage telemetry by default; never from CI
  DATAZOO_DISABLE_TELEMETRY: "1"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Lockfile is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy (core incl. serve, ffi, duckext)
        run: cargo clippy --locked --workspace --all-targets --features anofox-visualization/serve -- -D warnings

      # Before the tests: tests that run SQL through DuckDB (the paged SQL, the
      # locked server's data-folder statement check) use this CLI; the latter
      # fails instead of skipping when it is missing on CI.
      - name: Cache DuckDB CLI (pinned)
        uses: actions/cache@v4
        with:
          path: ~/.local/duckdb-1.5.6
          key: duckdb-cli-1.5.6-linux-amd64

      - name: Install DuckDB CLI (pinned)
        run: |
          d="$HOME/.local/duckdb-1.5.6"
          if [ ! -x "$d/duckdb" ]; then
            mkdir -p "$d"
            curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
            unzip -q duckdb.zip -d "$d"
            chmod +x "$d/duckdb"
          fi
          "$d/duckdb" --version
          echo "$d" >> "$GITHUB_PATH"

      - name: test (core incl. serve)
        run: cargo test --locked --features serve

      - name: test (ffi + duckext + vendored tiny_http)
        run: cargo test --locked -p anofox_viz_ffi -p anofox-visualization-duckdb -p tiny_http

      - name: C-API extension smoke test (render, NULL, errors)
        run: SKIP_WASM=1 OUT="$RUNNER_TEMP/anofox_visualization.duckdb_extension" duckext/scripts/build-native.sh

      - name: Locked server end to end (read-only session, search_path, limits)
        run: duckext/scripts/test-locked-server.sh "$RUNNER_TEMP/anofox_visualization.duckdb_extension"

      # The Python helper (python/), the snippets of docs/python-r.md and the
      # example notebook (examples/python), rendered through the extension
      # built above.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Python helper + docs snippets (pytest)
        working-directory: python
        env:
          ANOFOX_VIZ_EXTENSION: ${{ runner.temp }}/anofox_visualization.duckdb_extension
        run: |
          pip install "duckdb==1.5.6" -e ".[test]" pingouin lifelines statsforecast nbclient ipykernel
          pytest -q -rs

  web:
    # The browser-side tests (tests/web/*.mjs): app.js against the wasm build —
    # table formatting vectors, locale, contract plots, SVG attributes,
    # sanitising, the .xlsx writer and the DuckDB-Wasm extension smoke test.
    # A test that skips (a missing web/pkg, DuckDB-Wasm or wasm extension)
    # fails the job, so the wasm parts always run here.
    name: web tests (node + wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the wasm package (web/pkg)
        run: wasm-pack build --target web --out-dir web/pkg --no-default-features --features wasm

      - name: Install DuckDB-Wasm (tests/web)
        run: npm install --prefix tests/web --no-audit --no-fund

      - name: Fetch the anofox DuckDB-Wasm extensions (web/localext)
        run: |
          for i in 1 2 3; do scripts/fetch-wasm-extensions.sh && break; echo "fetch attempt $i failed; retrying"; sleep 10; done

      # Explore data's starter dashboards (#97): every sample table's starter
      # passes `dashboard --check --strict` (profiled with web/explore.js and
      # the wasm page_sql, linted against the native DuckDB CLI).
      - name: Install DuckDB CLI (pinned)
        run: |
          d="$HOME/.local/duckdb-1.5.6"
          mkdir -p "$d"
          curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip -d "$d"
          chmod +x "$d/duckdb"
          echo "$d" >> "$GITHUB_PATH"

      # (tests/web/lint_test.mjs compares the browser's Check with the CLI's)
      - name: Build the dashboard CLI
        run: cargo build --locked --bin dashboard

      - name: Run tests/web/*.mjs (no skips)
        run: |
          status=0
          for t in tests/web/*.mjs; do
            echo "== $t"
            out=$(node "$t" 2>&1) || { echo "$out"; echo "::error file=$t::failed"; status=1; continue; }
            echo "$out"
            if echo "$out" | grep -qi 'skip'; then echo "::error file=$t::skipped a part"; status=1; fi
          done
          exit $status

      - name: Explore starter dashboards pass --check --strict
        run: |
          # the hints' anofox_tabular checks run when the extension installs (#111)
          duckdb -unsigned -c "INSTALL anofox_tabular FROM 'https://get.erpl.io'" || echo "anofox_tabular not installed"
          node scripts/explore-starters.mjs --dashboard target/debug/dashboard --out "$RUNNER_TEMP/explore-starters"

  statistics-conformance:
    # Every anofox-statistics contract producer (141 functions: tagged
    # anofox.contract = '1') → anofox_plot(...) and its specific macro, on the
    # C-API build. DuckDB is pinned to v1.5.6 (get.erpl.io serves stale
    # anofox_statistics builds for older DuckDB releases).
    name: anofox-statistics conformance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install DuckDB CLI v1.5.6
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/duckdb"
          "$HOME/.local/bin/duckdb" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install anofox_statistics from get.erpl.io
        run: |
          for i in 1 2 3; do
            duckdb -unsigned -c "FORCE INSTALL anofox_statistics FROM 'https://get.erpl.io'" && break
            echo "install attempt $i failed; retrying"; sleep 10
          done
          duckdb -unsigned -c "LOAD anofox_statistics;
            SELECT extension_version FROM duckdb_extensions() WHERE extension_name = 'anofox_statistics';
            SELECT CASE WHEN anofox_contract_version() = '1' THEN 'contract 1'
                        ELSE error('anofox_statistics implements contract ' || anofox_contract_version() || ', expected 1') END;"

      - name: Build the C-API extension
        run: SKIP_WASM=1 OUT="$RUNNER_TEMP/anofox_visualization.duckdb_extension" duckext/scripts/build-native.sh --release

      - name: Conformance (every producer → anofox_plot + specific macro)
        run: |
          python3 scripts/statistics_conformance.py --duckdb duckdb \
            --ext "$RUNNER_TEMP/anofox_visualization.duckdb_extension" \
            --out "$RUNNER_TEMP/statistics-conformance" --jobs 4 --no-montage

      - name: Upload the SVGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statistics-conformance-svgs
          path: ${{ runner.temp }}/statistics-conformance
          if-no-files-found: ignore

  optimize-conformance:
    # Every anofox-optimize solver (38 scalar functions in 8 families; the
    # extension tags none anofox.contract, so the harness discovers them by
    # name and fails on one without a recipe): return type and solution
    # invariants, its objectives through anofox_plot(...) and
    # anofox_plot_summary(...), its decision view through anofox_render. On
    # the C-API build, DuckDB pinned to v1.5.6; anofox_optimize from
    # get.erpl.io (the community repository has no v1.5.6 build of it yet).
    name: anofox-optimize conformance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATAZOO_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install DuckDB CLI v1.5.6
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/duckdb"
          "$HOME/.local/bin/duckdb" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install anofox_optimize from get.erpl.io
        run: |
          for i in 1 2 3; do
            duckdb -unsigned -c "FORCE INSTALL anofox_optimize FROM 'https://get.erpl.io'" && break
            echo "install attempt $i failed; retrying"; sleep 10
          done
          duckdb -unsigned -c "LOAD anofox_optimize; SELECT anofox_optimize_version();"

      - name: Build the C-API extension
        run: SKIP_WASM=1 OUT="$RUNNER_TEMP/anofox_visualization.duckdb_extension" duckext/scripts/build-native.sh --release

      - name: Conformance (every solver → anofox_plot + its decision view)
        run: |
          python3 scripts/optimize_conformance.py --duckdb duckdb \
            --ext "$RUNNER_TEMP/anofox_visualization.duckdb_extension" \
            --out "$RUNNER_TEMP/optimize-conformance" --jobs 4 --no-montage

      - name: Upload the SVGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimize-conformance-svgs
          path: ${{ runner.temp }}/optimize-conformance
          if-no-files-found: ignore

  decide-conformance:
    # anofox-decide tags no contract producer yet: every decide output goes
    # through the SQL bridge to a contract schema (metrics → summary,
    # probabilities → ROC / PR / calibration curves) and on to anofox_plot(...)
    # and its specific macro; the raw outputs that no schema takes must fail
    # cleanly; a tagged producer without a recipe fails the job. Answers come
    # from decide's built-in stub model (offline, deterministic). anofox_decide
    # from the community repository (signed), anofox_statistics from get.erpl.io
    # for its curve producers; DuckDB pinned to v1.5.6.
    name: anofox-decide conformance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATAZOO_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install DuckDB CLI v1.5.6
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/duckdb"
          "$HOME/.local/bin/duckdb" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install anofox_decide (community) and anofox_statistics (get.erpl.io)
        run: |
          for i in 1 2 3; do
            duckdb -c "FORCE INSTALL anofox_decide FROM community" && break
            echo "install attempt $i failed; retrying"; sleep 10
          done
          for i in 1 2 3; do
            duckdb -unsigned -c "FORCE INSTALL anofox_statistics FROM 'https://get.erpl.io'" && break
            echo "install attempt $i failed; retrying"; sleep 10
          done
          duckdb -c "LOAD anofox_decide;
            SELECT extension_version FROM duckdb_extensions() WHERE extension_name = 'anofox_decide';"

      - name: Build the C-API extension
        run: SKIP_WASM=1 OUT="$RUNNER_TEMP/anofox_visualization.duckdb_extension" duckext/scripts/build-native.sh --release

      - name: Conformance (every decide output → anofox_plot + specific macro)
        run: |
          python3 scripts/decide_conformance.py --duckdb duckdb \
            --ext "$RUNNER_TEMP/anofox_visualization.duckdb_extension" \
            --out "$RUNNER_TEMP/decide-conformance" --statistics yes --jobs 4 --no-montage

      - name: Upload the SVGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decide-conformance-svgs
          path: ${{ runner.temp }}/decide-conformance
          if-no-files-found: ignore

  skills-sql:
    # Every ```sql block of the Claude Code plugin's skills
    # (plugins/anofox-visualization/skills/*/SKILL.md) runs against the C-API
    # build: plain blocks in a fresh DuckDB process, ```sql dashboard blocks
    # through `dashboard --check --strict`, ```sql skip blocks not at all.
    # Blocks that LOAD anofox_statistics / anofox_forecast get them from
    # get.erpl.io / the community repository (DuckDB v1.5.6).
    name: Claude Code skills SQL
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install DuckDB CLI v1.5.6
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/duckdb"
          "$HOME/.local/bin/duckdb" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the C-API extension and the dashboard CLI
        run: |
          SKIP_WASM=1 OUT="$RUNNER_TEMP/anofox_visualization.duckdb_extension" duckext/scripts/build-native.sh --release
          cargo build --locked --release --bin dashboard

      - name: Validate the skills' SQL
        run: |
          python3 scripts/validate_skills_sql.py --duckdb duckdb \
            --ext "$RUNNER_TEMP/anofox_visualization.duckdb_extension" \
            --dashboard target/release/dashboard \
            --workdir "$RUNNER_TEMP/skills-sql" --jobs 4

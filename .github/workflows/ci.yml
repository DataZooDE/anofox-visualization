name: CI

# Rust checks for the whole workspace (core, crates/anofox-viz-ffi, duckext).
# The C++ extension's sqllogictests (test/sql) run in
# MainDistributionPipeline.yml via extension-ci-tools (`make test`).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # anofox extensions send usage telemetry by default; never from CI
  DATAZOO_DISABLE_TELEMETRY: "1"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Lockfile is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy (core incl. serve, ffi, duckext)
        run: cargo clippy --locked --workspace --all-targets --features anofox-visualization/serve -- -D warnings

      # Before the tests: tests that run SQL through DuckDB (the paged SQL, the
      # locked server's data-folder statement check) use this CLI; the latter
      # fails instead of skipping when it is missing on CI.
      - name: Cache DuckDB CLI (pinned)
        uses: actions/cache@v4
        with:
          path: ~/.local/duckdb-1.5.6
          key: duckdb-cli-1.5.6-linux-amd64

      - name: Install DuckDB CLI (pinned)
        run: |
          d="$HOME/.local/duckdb-1.5.6"
          if [ ! -x "$d/duckdb" ]; then
            mkdir -p "$d"
            curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
            unzip -q duckdb.zip -d "$d"
            chmod +x "$d/duckdb"
          fi
          "$d/duckdb" --version
          echo "$d" >> "$GITHUB_PATH"

      - name: test (core incl. serve)
        run: cargo test --locked --features serve

      - name: test (ffi + duckext + vendored tiny_http)
        run: cargo test --locked -p anofox_viz_ffi -p anofox-visualization-duckdb -p tiny_http

      - name: C-API extension smoke test (render, NULL, errors)
        run: SKIP_WASM=1 OUT="$RUNNER_TEMP/anofox_visualization.duckdb_extension" duckext/scripts/build-native.sh

      - name: Locked server end to end (read-only session, search_path, limits)
        run: duckext/scripts/test-locked-server.sh "$RUNNER_TEMP/anofox_visualization.duckdb_extension"

      # #357: the access policy's hash-mask key never reaches a panel, an
      # error, the dashboard page, /healthz, stderr or the request log, and
      # SQL that could reveal it is refused at start.
      - name: Access policy key e2e (hash mask key never leaks)
        run: duckext/scripts/policy-key-e2e.sh "$RUNNER_TEMP/anofox_visualization.duckdb_extension"

      # The Python helper (python/), the snippets of docs/python-r.md and the
      # example notebook (examples/python), rendered through the extension
      # built above.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Python helper + docs snippets (pytest)
        working-directory: python
        env:
          ANOFOX_VIZ_EXTENSION: ${{ runner.temp }}/anofox_visualization.duckdb_extension
        run: |
          pip install "duckdb==1.5.6" -e ".[test]" pingouin lifelines statsforecast nbclient ipykernel
          pytest -q -rs

  duckdb-2-0-smoke:
    # #352: non-blocking. DuckDB 2.0 LTS shipped 2026-10-21; our release pin
    # (`.duckdb-version`) stays at v1.5.6 until ~2.0.1, but research found the
    # Rust C-API cdylib (C_STRUCT, C-API v1.2.0) built for 1.5.6 loads
    # unchanged on 2.0.0 (research-duckdb-2.0.md). This job builds it fresh
    # against a real 2.0.0 CLI and runs the locked-server end-to-end smoke
    # test, so a future break shows up here without failing CI. The 2.0
    # release asset is named differently (`duckdb-cli-...tar.gz`, not
    # `duckdb_cli-...zip`) — the pinned jobs above keep the old name.
    name: DuckDB 2.0 smoke test (Rust C-API cdylib, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache DuckDB CLI (2.0.0)
        uses: actions/cache@v4
        with:
          path: ~/.local/duckdb-2.0.0
          key: duckdb-cli-2.0.0-linux-amd64

      - name: Install DuckDB CLI (2.0.0)
        run: |
          d="$HOME/.local/duckdb-2.0.0"
          if [ ! -x "$d/duckdb" ]; then
            mkdir -p "$d"
            curl -fsSL --retry 3 -o duckdb.tar.gz https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-cli-linux-amd64.tar.gz
            tar -xzf duckdb.tar.gz -C "$d"
            chmod +x "$d/duckdb"
          fi
          "$d/duckdb" --version
          echo "$d" >> "$GITHUB_PATH"

      # #357: the access policy's rewrite (src/host/policy.rs) depends on
      # `json_serialize_sql`'s exact shape, which 2.0's PEG parser changed;
      # this runs tests/policy_duckdb.rs (and `every_duckdb_function_is_
      # classified`, which fails if 2.0 adds a function src/host/
      # policy_functions.txt doesn't yet classify) against the real 2.0 CLI
      # now first on PATH, alongside the rest of the suite.
      - name: test (core incl. serve and the access policy suite), against DuckDB 2.0
        run: cargo test --locked --features serve

      - name: Build the C-API extension (Rust cdylib)
        run: SKIP_WASM=1 OUT="$RUNNER_TEMP/anofox_visualization.duckdb_extension" duckext/scripts/build-native.sh

      - name: Locked server end to end, against DuckDB 2.0
        run: duckext/scripts/test-locked-server.sh "$RUNNER_TEMP/anofox_visualization.duckdb_extension"

      - name: Access policy key e2e, against DuckDB 2.0
        run: duckext/scripts/policy-key-e2e.sh "$RUNNER_TEMP/anofox_visualization.duckdb_extension"

  web:
    # The browser-side tests (tests/web/*.mjs): app.js against the wasm build —
    # table formatting vectors, locale, contract plots, SVG attributes,
    # sanitising, the .xlsx writer and the DuckDB-Wasm extension smoke test.
    # A test that skips (a missing web/pkg, DuckDB-Wasm or wasm extension)
    # fails the job, so the wasm parts always run here.
    name: web tests (node + wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history + tags: tests/web/version_test.mjs checks the footer's build version (#216).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the wasm package (web/pkg)
        run: wasm-pack build --target web --out-dir web/pkg --profile wasm --no-default-features --features wasm

      # web/wasm-size.txt + 30 KB (#312). Only meaningful because the build
      # above uses [profile.wasm] (fat LTO, one codegen unit) — see that
      # script's header comment.
      - name: wasm bundle size is within budget
        run: node scripts/check-wasm-size.mjs --check

      - name: Install DuckDB-Wasm (tests/web)
        run: npm install --prefix tests/web --no-audit --no-fund

      - name: Fetch the anofox DuckDB-Wasm extensions (web/localext)
        run: |
          for i in 1 2 3; do scripts/fetch-wasm-extensions.sh && break; echo "fetch attempt $i failed; retrying"; sleep 10; done

      # The assistant's function lists (web/assist/functions.js) come from the
      # pinned builds (scripts/wasm-extensions.lock); after a bump, run
      # node scripts/gen-assist-functions.mjs, review what it prints, commit.
      - name: The assistant's function lists are current
        run: node scripts/gen-assist-functions.mjs --check

      # scripts/telemetry-e2e.mjs (#334): no visitor's browser reports usage to
      # a third party. Playwright itself came from tests/web's npm install
      # above (tests/web/package.json devDependencies); only its Chromium
      # binary is cached here.
      - name: Cache Playwright's browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('tests/web/package.json') }}

      - name: Install Playwright's Chromium
        working-directory: tests/web
        run: npx playwright install --with-deps chromium

      - name: Serve web/ for the browser e2e checks
        run: |
          nohup python3 serve_nocache.py 8947 > "$RUNNER_TEMP/serve_nocache.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/serve_nocache.pid"
          for i in $(seq 1 30); do curl -fs -o /dev/null http://127.0.0.1:8947/ && break; sleep 0.5; done
          curl -fs -o /dev/null http://127.0.0.1:8947/ || { echo "::error::serve_nocache.py on :8947 never came up"; cat "$RUNNER_TEMP/serve_nocache.log"; exit 1; }

      # --selftest makes the page also try a PostHog request, which the harness
      # must record and abort — proving it would have caught a real one.
      - name: Telemetry e2e selftest (must fail on the PostHog probe)
        run: |
          if NODE_PATH="$PWD/tests/web/node_modules" node scripts/telemetry-e2e.mjs --url http://127.0.0.1:8947/ --selftest; then
            echo "::error::--selftest should fail on its PostHog probe but exited 0"
            exit 1
          fi
          echo "selftest correctly caught and aborted the telemetry probe"

      - name: Telemetry e2e (no request to a telemetry or unexpected host)
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/telemetry-e2e.mjs --url http://127.0.0.1:8947/

      # scratchRunner's timeout against a real, uncancelled-looking query
      # in the real DuckDB-Wasm Worker (#258, a follow-up to #200): the
      # unit tests (tests/web/lint_test.mjs) prove the cleanup logic with a
      # mock connection; this proves DuckDB-Wasm actually honours the
      # cancel and the page database works again right after.
      - name: Scratch cancel e2e (a late query is really cancelled in the Worker)
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/scratch-cancel-e2e.mjs --url http://127.0.0.1:8947/
      # scripts/toolbar-e2e.mjs (#354 follow-up): ::TOOLBAR's per-part gating
      # in a real browser (totals row vs its toggle button, excluded parts'
      # saved search/filter/hidden-column state, the Pages|Scroll segment,
      # the hover ⤓ CSV fallback and its ::SPARKLINE false-positive, the
      # 'none' + multi-select chip exception) — reuses the :8947 server and
      # Chromium above.
      - name: Table toolbar e2e (::TOOLBAR gating)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/toolbar-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/astables-e2e.mjs (#401): "Charts as tables" is opt-in — off
      # by default with no in-page bar, the toolbar's ⋯ menu item reaches it
      # either way (bar or no bar) and stays in sync with the bar's own
      # button, and `-- @astables on` (not `off`/an unrecognized value)
      # shows the bar. Reuses the :8947 server and Chromium above.
      - name: Charts-as-tables opt-in e2e (#401)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/astables-e2e.mjs --url http://127.0.0.1:8947/

      # The downloaded HTML's tab/sub-tab switcher (#381, an owner-reported
      # regression): exports a dashboard with tabs and sub-tabs and clicks
      # through every one in the downloaded file, offline.
      - name: Sub-tabs export e2e (every ::TAB / ::SUBTAB page in the downloaded HTML)
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/subtabs-export-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/fit-e2e.mjs (#400): a 'fit'::FIT tab fills the window with no
      # page scroll at 1920x1080 / 1366x768 / 3840x2160, its charts redrawn
      # at their fitted pixel size (not stretched); a tab without ::FIT, an
      # overloaded ::FIT tab (fallback + notice), ?fit=0 / ?fit=1, a resize
      # and a cross-filter re-run — reuses the :8947 server and Chromium above.
      - name: Fit-to-screen e2e (::FIT tabs)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/fit-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/dropdown-search-e2e.mjs (#411): above ~50 options (or forced
      # by 'search'/'native'::DROPDOWN_STYLE) a ::DROPDOWN renders a
      # searchable combobox — filtering by value/::OPTION_LABEL, Arrow keys +
      # Enter, Esc / an outside click, a 2,000-option window, and the
      # downloaded HTML snapshot's native <select> fallback.
      - name: Searchable ::DROPDOWN e2e (#411)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/dropdown-search-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/setvar-order-e2e.mjs (#416): a dashboard's own `SET
      # VARIABLE` that reads an input via getvariable() sees the viewer's
      # CURRENT pick, whether it is declared before or after that input in
      # the script — a Share link's first load and a later pick, in a real
      # browser. Reuses the :8947 server and Chromium above.
      - name: SET VARIABLE order e2e (#416)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/setvar-order-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/compact-kpi-e2e.mjs (#405): 'compact'::KPI_SIZE on a ::GROUP
      # packs its tiles onto one line each, well under the normal ~96px
      # floor, a tile's own ::KPI_SIZE overriding the box's; ::THRESHOLDS
      # still colours the value; ::FIT gives a compact tile its own, lower
      # floor. Reuses the :8947 server and Chromium above.
      - name: Compact KPI tiles e2e (::KPI_SIZE 'compact')
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/compact-kpi-e2e.mjs --url http://127.0.0.1:8947/

      - name: Stop the web/ server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/serve_nocache.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/serve_nocache.pid")" 2>/dev/null || true
          fi

      # Explore data's starter dashboards (#97): every sample table's starter
      # passes `dashboard --check --strict` (profiled with web/explore.js and
      # the wasm page_sql, linted against the native DuckDB CLI).
      - name: Install DuckDB CLI (pinned)
        run: |
          d="$HOME/.local/duckdb-1.5.6"
          mkdir -p "$d"
          curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip -d "$d"
          chmod +x "$d/duckdb"
          echo "$d" >> "$GITHUB_PATH"

      # (tests/web/lint_test.mjs compares the browser's Check with the CLI's)
      - name: Build the dashboard CLI
        run: cargo build --locked --bin dashboard

      - name: Run tests/web/*.mjs (no skips)
        run: |
          status=0
          for t in tests/web/*.mjs; do
            echo "== $t"
            out=$(node "$t" 2>&1) || { echo "$out"; echo "::error file=$t::failed"; status=1; continue; }
            echo "$out"
            if echo "$out" | grep -qi 'skip'; then echo "::error file=$t::skipped a part"; status=1; fi
          done
          exit $status

      - name: Explore starter dashboards pass --check --strict
        run: |
          # the hints' anofox_tabular checks run when the extension installs (#111)
          duckdb -c "INSTALL anofox_tabular FROM community" || echo "anofox_tabular not installed"
          node scripts/explore-starters.mjs --dashboard target/debug/dashboard --out "$RUNNER_TEMP/explore-starters"

  statistics-conformance:
    # Every anofox-statistics contract producer (141 functions: tagged
    # anofox.contract = '1') → anofox_plot(...) and its specific macro, on the
    # C-API build. DuckDB is pinned to v1.5.6 (get.erpl.io serves stale
    # anofox_statistics builds for older DuckDB releases).
    name: anofox-statistics conformance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install DuckDB CLI v1.5.6
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/duckdb"
          "$HOME/.local/bin/duckdb" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install anofox_statistics from get.erpl.io
        run: |
          for i in 1 2 3; do
            duckdb -unsigned -c "FORCE INSTALL anofox_statistics FROM 'https://get.erpl.io'" && break
            echo "install attempt $i failed; retrying"; sleep 10
          done
          duckdb -unsigned -c "LOAD anofox_statistics;
            SELECT extension_version FROM duckdb_extensions() WHERE extension_name = 'anofox_statistics';
            SELECT CASE WHEN anofox_contract_version() = '1' THEN 'contract 1'
                        ELSE error('anofox_statistics implements contract ' || anofox_contract_version() || ', expected 1') END;"

      - name: Build the C-API extension
        run: SKIP_WASM=1 OUT="$RUNNER_TEMP/anofox_visualization.duckdb_extension" duckext/scripts/build-native.sh --release

      - name: Conformance (every producer → anofox_plot + specific macro)
        run: |
          python3 scripts/statistics_conformance.py --duckdb duckdb \
            --ext "$RUNNER_TEMP/anofox_visualization.duckdb_extension" \
            --out "$RUNNER_TEMP/statistics-conformance" --jobs 4 --no-montage

      - name: Upload the SVGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statistics-conformance-svgs
          path: ${{ runner.temp }}/statistics-conformance
          if-no-files-found: ignore

  optimize-conformance:
    # Every anofox-optimize solver (38 scalar functions in 8 families; the
    # extension tags none anofox.contract, so the harness discovers them by
    # name and fails on one without a recipe): return type and solution
    # invariants, its objectives through anofox_plot(...) and
    # anofox_plot_summary(...), its decision view through anofox_render. On
    # the C-API build, DuckDB pinned to v1.5.6; anofox_optimize from
    # get.erpl.io (the community repository has no v1.5.6 build of it yet).
    name: anofox-optimize conformance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATAZOO_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install DuckDB CLI v1.5.6
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/duckdb"
          "$HOME/.local/bin/duckdb" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install anofox_optimize from get.erpl.io
        run: |
          for i in 1 2 3; do
            duckdb -unsigned -c "FORCE INSTALL anofox_optimize FROM 'https://get.erpl.io'" && break
            echo "install attempt $i failed; retrying"; sleep 10
          done
          duckdb -unsigned -c "LOAD anofox_optimize; SELECT anofox_optimize_version();"

      - name: Build the C-API extension
        run: SKIP_WASM=1 OUT="$RUNNER_TEMP/anofox_visualization.duckdb_extension" duckext/scripts/build-native.sh --release

      - name: Conformance (every solver → anofox_plot + its decision view)
        run: |
          python3 scripts/optimize_conformance.py --duckdb duckdb \
            --ext "$RUNNER_TEMP/anofox_visualization.duckdb_extension" \
            --out "$RUNNER_TEMP/optimize-conformance" --jobs 4 --no-montage

      - name: Upload the SVGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimize-conformance-svgs
          path: ${{ runner.temp }}/optimize-conformance
          if-no-files-found: ignore

  decide-conformance:
    # anofox-decide tags no contract producer yet: every decide output goes
    # through the SQL bridge to a contract schema (metrics → summary,
    # probabilities → ROC / PR / calibration curves) and on to anofox_plot(...)
    # and its specific macro; the raw outputs that no schema takes must fail
    # cleanly; a tagged producer without a recipe fails the job. Answers come
    # from decide's built-in stub model (offline, deterministic). anofox_decide
    # from the community repository (signed), anofox_statistics from get.erpl.io
    # for its curve producers; DuckDB pinned to v1.5.6.
    name: anofox-decide conformance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATAZOO_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install DuckDB CLI v1.5.6
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/duckdb"
          "$HOME/.local/bin/duckdb" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install anofox_decide (community) and anofox_statistics (get.erpl.io)
        run: |
          for i in 1 2 3; do
            duckdb -c "FORCE INSTALL anofox_decide FROM community" && break
            echo "install attempt $i failed; retrying"; sleep 10
          done
          for i in 1 2 3; do
            duckdb -unsigned -c "FORCE INSTALL anofox_statistics FROM 'https://get.erpl.io'" && break
            echo "install attempt $i failed; retrying"; sleep 10
          done
          duckdb -c "LOAD anofox_decide;
            SELECT extension_version FROM duckdb_extensions() WHERE extension_name = 'anofox_decide';"

      - name: Build the C-API extension
        run: SKIP_WASM=1 OUT="$RUNNER_TEMP/anofox_visualization.duckdb_extension" duckext/scripts/build-native.sh --release

      - name: Conformance (every decide output → anofox_plot + specific macro)
        run: |
          python3 scripts/decide_conformance.py --duckdb duckdb \
            --ext "$RUNNER_TEMP/anofox_visualization.duckdb_extension" \
            --out "$RUNNER_TEMP/decide-conformance" --statistics yes --jobs 4 --no-montage

      - name: Upload the SVGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decide-conformance-svgs
          path: ${{ runner.temp }}/decide-conformance
          if-no-files-found: ignore

  tabular-conformance:
    # Every anofox-tabular result producer (the anofox_tab_* table functions
    # but config/status; none is tagged anofox.contract yet) → an adapter to
    # the nearest contract schema or a generic chart → anofox_plot(...) and
    # the specific macro, on the C-API build. anofox_tabular comes signed from
    # the community repository (pinned by its description.yml), DuckDB v1.5.6.
    name: anofox-tabular conformance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATAZOO_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install DuckDB CLI v1.5.6
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/duckdb"
          "$HOME/.local/bin/duckdb" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install anofox_tabular from the community repository
        run: |
          for i in 1 2 3; do
            duckdb -c "INSTALL anofox_tabular FROM community" && break
            echo "install attempt $i failed; retrying"; sleep 10
          done
          duckdb -c "LOAD anofox_tabular;
            SELECT extension_version FROM duckdb_extensions() WHERE extension_name = 'anofox_tabular';"

      - name: Build the C-API extension
        run: SKIP_WASM=1 OUT="$RUNNER_TEMP/anofox_visualization.duckdb_extension" duckext/scripts/build-native.sh --release

      - name: Conformance (every producer → anofox_plot + specific macro)
        run: |
          python3 scripts/tabular_conformance.py --duckdb duckdb \
            --ext "$RUNNER_TEMP/anofox_visualization.duckdb_extension" \
            --out "$RUNNER_TEMP/tabular-conformance" --jobs 4 --no-montage

      - name: Upload the SVGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tabular-conformance-svgs
          path: ${{ runner.temp }}/tabular-conformance
          if-no-files-found: ignore

  forecast-conformance:
    # Every anofox-forecast producer (a curated registry: the extension does
    # not tag its functions) → anofox_plot(...) and its specific macro, on the
    # C-API build, against the community release and the main build from
    # get.erpl.io. DuckDB is pinned to v1.5.6.
    name: anofox-forecast conformance (${{ matrix.repo }})
    runs-on: ubuntu-latest
    env:
      DATAZOO_DISABLE_TELEMETRY: "1"
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        repo: [community, get.erpl.io]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install DuckDB CLI v1.5.6
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/duckdb"
          "$HOME/.local/bin/duckdb" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install anofox_forecast from ${{ matrix.repo }}
        run: |
          if [ "${{ matrix.repo }}" = community ]; then
            src="community"
          else
            src="'https://${{ matrix.repo }}'"
          fi
          for i in 1 2 3; do
            duckdb -unsigned -c "FORCE INSTALL anofox_forecast FROM $src" && break
            echo "install attempt $i failed; retrying"; sleep 10
          done
          duckdb -unsigned -c "LOAD anofox_forecast;
            SELECT extension_version, installed_from FROM duckdb_extensions() WHERE extension_name = 'anofox_forecast';"

      - name: Build the C-API extension
        run: SKIP_WASM=1 OUT="$RUNNER_TEMP/anofox_visualization.duckdb_extension" duckext/scripts/build-native.sh --release

      - name: Conformance (every producer → anofox_plot + specific macro)
        run: |
          python3 scripts/forecast_conformance.py --duckdb duckdb \
            --ext "$RUNNER_TEMP/anofox_visualization.duckdb_extension" \
            --out "$RUNNER_TEMP/forecast-conformance" --jobs 4 --no-montage

      - name: Upload the SVGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-conformance-svgs-${{ matrix.repo }}
          path: ${{ runner.temp }}/forecast-conformance
          if-no-files-found: ignore

  skills-sql:
    # Every ```sql block of the Claude Code plugin's skills
    # (plugins/anofox-visualization/skills/*/SKILL.md) runs against the C-API
    # build: plain blocks in a fresh DuckDB process, ```sql dashboard blocks
    # through `dashboard --check --strict`, ```sql skip blocks not at all.
    # Blocks that LOAD anofox_statistics / anofox_forecast get them from
    # get.erpl.io / the community repository (DuckDB v1.5.6).
    name: Claude Code skills SQL
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install DuckDB CLI v1.5.6
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/duckdb"
          "$HOME/.local/bin/duckdb" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the C-API extension and the dashboard CLI
        run: |
          SKIP_WASM=1 OUT="$RUNNER_TEMP/anofox_visualization.duckdb_extension" duckext/scripts/build-native.sh --release
          cargo build --locked --release --bin dashboard

      - name: Validate the skills' SQL
        run: |
          python3 scripts/validate_skills_sql.py --duckdb duckdb \
            --ext "$RUNNER_TEMP/anofox_visualization.duckdb_extension" \
            --dashboard target/release/dashboard \
            --workdir "$RUNNER_TEMP/skills-sql" --jobs 4

  quack-source:
    # #352 prototype, not yet security-reviewed: options.source builds a
    # locked server's snapshot from a live DuckDB 2.0 Quack source.
    # duckext/scripts/test-quack-source.sh (end-to-end + the security pass:
    # dashboard SQL reaching for Quack/getenv/duckdb_secrets()/
    # duckdb_databases() is refused, the token never leaks, quack is never
    # loaded into the serving instance). Needs a DuckDB 2.0 host — unlike
    # every other job here, which targets the pinned 1.5.6 — so it is kept
    # non-blocking (continue-on-error) until that review lands.
    name: Quack source (DuckDB 2.0 host, non-blocking prototype, #352)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install DuckDB 2.0 CLI
        run: |
          d="$HOME/.local/duckdb-2.0.0"
          mkdir -p "$d"
          curl -fsSL --retry 3 -o duckdb2.tar.gz https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-cli-linux-amd64.tar.gz
          tar -xzf duckdb2.tar.gz -C "$d"
          chmod +x "$d/duckdb"
          "$d/duckdb" --version
          echo "DUCKDB2=$d/duckdb" >> "$GITHUB_ENV"

      # build-native.sh's own smoke test needs A DuckDB CLI too (any version
      # works for that — it only loads the extension and runs a plot), and
      # defaults to ~/.local/bin/duckdb when $DUCKDB isn't set. The pinned
      # 1.5.6 CLI the main CI job already installs is the obvious one to
      # reuse here; exporting $DUCKDB (build-native.sh's own override) is
      # simpler than relying on PATH resolution order against DUCKDB2.
      - name: Cache DuckDB CLI (pinned, for build-native.sh's smoke test)
        uses: actions/cache@v4
        with:
          path: ~/.local/duckdb-1.5.6
          key: duckdb-cli-1.5.6-linux-amd64

      - name: Install DuckDB CLI (pinned, for build-native.sh's smoke test)
        run: |
          d="$HOME/.local/duckdb-1.5.6"
          if [ ! -x "$d/duckdb" ]; then
            mkdir -p "$d"
            curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
            unzip -q duckdb.zip -d "$d"
            chmod +x "$d/duckdb"
          fi
          "$d/duckdb" --version
          echo "DUCKDB=$d/duckdb" >> "$GITHUB_ENV"

      - name: Build the native extension (runs fine on a 1.5.6-targeted Rust build; only the host needs to be 2.0)
        run: SKIP_WASM=1 OUT="$RUNNER_TEMP/anofox_visualization.duckdb_extension" duckext/scripts/build-native.sh

      - name: Install quack (a repository extension; only reachable from the 2.0 host)
        run: $DUCKDB2 -c "INSTALL quack; LOAD quack;"

      - name: Quack source end to end + security (test-quack-source.sh)
        run: duckext/scripts/test-quack-source.sh "$RUNNER_TEMP/anofox_visualization.duckdb_extension"

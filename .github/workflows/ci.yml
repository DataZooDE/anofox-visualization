    # but config/status; none is tagged anofox.contract yet) → an adapter to
    # the nearest contract schema or a generic chart → anofox_plot(...) and
    # the specific macro, on the C-API build. anofox_tabular comes signed from
    # the community repository (pinned by its description.yml), DuckDB v1.5.6.
    # #464: full lane only (live network install, see statistics-conformance).
    name: anofox-tabular conformance
    needs: lane
    if: needs.lane.outputs.full == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    env:
      DATAZOO_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install DuckDB CLI v1.5.6
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/duckdb"
          "$HOME/.local/bin/duckdb" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install anofox_tabular from the community repository
        run: |

name: CI

# Rust checks for the whole workspace (core, crates/anofox-viz-ffi, duckext).
# The C++ extension's sqllogictests (test/sql) run here too (`sqllogictest`
# job, `make test`, linux_amd64 only); the full cross-platform matrix build
# is MainDistributionPipeline.yml via extension-ci-tools.
#
# #464: two lanes, decided once by lane.yml.
#   - PR fast lane (target ~10 min): rust (fmt+clippy+nextest), the C++ ABI
#     extension's sqllogictests (test/sql/*.test, linux_amd64, #491), the web
#     tests/e2e (wasm built once, tests/web/*.mjs sharded 4-way), the wasm
#     size check. A docs-only PR (every changed file *.md or under docs/)
#     instead runs only a markdown/link check.
#   - Full lane (release-grade): everything above, plus the DuckDB 2.0 smoke
#     test, the Quack prototype, the strict Explore-starters check, the
#     skills-SQL validator and every *-conformance job (they install
#     extensions from live network sources). Runs on push to master, a v*
#     tag, workflow_dispatch, the nightly schedule, a release/* branch, or a
#     PR labelled `full-ci`.
# `ci-gate` is the one stable "mergeable" check: it passes when every needed
# job succeeded or was skipped (so a docs-only PR resolves cleanly instead of
# leaving full-lane-only jobs pending forever).
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  # A spurious run (one whose `lane` job skips below — #491/#531) must not
  # cancel the real run it shares a ref with: GitHub applies
  # cancel-in-progress at the whole-run level, before any job's `if` is
  # evaluated, so without this the spurious run still kills the real one
  # mid-flight and leaves its jobs looking like failures. Giving it a
  # per-run_id (so unique, never-colliding) group suffix instead opts it out
  # of the shared group entirely; every other trigger keeps the plain,
  # stable group (empty suffix) and the normal cancel-newer-wins behaviour.
  # Two cases are spurious, both kept in sync with `lane`'s `if` below:
  #   - a labeled/unlabeled event whose label isn't `full-ci` (#491) — the
  #     one label lane.yml looks at.
  #   - (#531) an `opened` event where the PR *already* carries `full-ci`
  #     (e.g. `gh pr create --label full-ci`): GitHub fires `opened` and
  #     `labeled` as two separate events for the same label, so the
  #     `labeled` one (not `opened`) is treated as the real run here.
  group: "${{ github.workflow }}-${{ github.ref }}-${{ ((github.event_name == 'pull_request' && contains(fromJson('[\"labeled\",\"unlabeled\"]'), github.event.action) && github.event.label.name != 'full-ci') || (github.event_name == 'pull_request' && github.event.action == 'opened' && contains(github.event.pull_request.labels.*.name, 'full-ci'))) && github.run_id || '' }}"
  cancel-in-progress: true

env:
  # anofox extensions send usage telemetry by default; never from CI
  DATAZOO_DISABLE_TELEMETRY: "1"
  CARGO_TERM_COLOR: always

jobs:
  # Opening a PR *with* a label already attached (e.g. `gh pr create --label
  # full-ci`) fires `opened` and `labeled` together — two runs that, without
  # the concurrency group's exemptions above, share a group, so one cancels
  # the other and its never-started jobs sit on the PR as "fail" checks
  # (#491, as hit by #490/#492; the `opened`+`full-ci` case specifically is
  # #531, hit by #530). `labeled`/`unlabeled` only needs to re-run the lane
  # when the label itself is `full-ci`; every other labeled/unlabeled event
  # is unaffected (first condition). An `opened` event is itself spurious
  # when the PR already has `full-ci` at open time, since a `labeled` event
  # for that same label is guaranteed to follow right after and do the real
  # run (second condition) — `synchronize`/`reopened`, push, schedule and
  # workflow_dispatch are never spurious. Skipping `lane` here skips every
  # job below it too (they all `needs: lane` and check its outputs), and
  # ci-gate treats "skipped" as passing, so a redundant run resolves cleanly
  # instead of leaving checks pending.
  lane:
    if: >-
      (
        github.event_name != 'pull_request' ||
        !contains(fromJson('["labeled","unlabeled"]'), github.event.action) ||
        github.event.label.name == 'full-ci'
      ) &&
      !(
        github.event_name == 'pull_request' &&
        github.event.action == 'opened' &&
        contains(github.event.pull_request.labels.*.name, 'full-ci')
      )
    uses: ./.github/workflows/lane.yml

  # ---- docs-only PRs: a markdown/link check instead of the whole lane ----
  docs-check:
    name: docs/link check (docs-only PR)
    needs: lane
    if: needs.lane.outputs.docs_only == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: gaurav-nelson/github-action-markdown-link-check@1.0.17
        with:
          use-quiet-mode: "yes"
          check-modified-files-only: "yes"
          base-branch: ${{ github.event.pull_request.base.ref }}

  rust:
    name: fmt + clippy + test
    needs: lane
    if: needs.lane.outputs.full == 'true' || needs.lane.outputs.docs_only != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Lockfile is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy (core incl. serve, ffi, duckext)
        run: cargo clippy --locked --workspace --all-targets --features anofox-visualization/serve -- -D warnings

      # Before the tests: tests that run SQL through DuckDB (the paged SQL, the
      # locked server's data-folder statement check) use this CLI; the latter
      # fails instead of skipping when it is missing on CI.
      - name: Cache DuckDB CLI (pinned)
        uses: actions/cache@v4
        with:
          path: ~/.local/duckdb-1.5.6
          key: duckdb-cli-1.5.6-linux-amd64

      - name: Install DuckDB CLI (pinned)
        run: |
          d="$HOME/.local/duckdb-1.5.6"
          if [ ! -x "$d/duckdb" ]; then
            mkdir -p "$d"
            curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
            unzip -q duckdb.zip -d "$d"
            chmod +x "$d/duckdb"
          fi
          "$d/duckdb" --version
          echo "$d" >> "$GITHUB_PATH"

      # cargo-nextest doesn't run doctests (#464); `cargo test --doc` alongside
      # it covers those (src/boxstats.rs, period.rs, thresholds.rs, theme.rs,
      # lib.rs, and vendor/tiny_http's).
      - name: test (core incl. serve)
        run: cargo nextest run --locked --features serve
      - name: test (core incl. serve) — doctests
        run: cargo test --doc --locked --features serve

      # No separate doctest step here: anofox_viz_ffi/anofox-visualization-duckdb
      # are staticlib/cdylib only (doctests aren't supported for those crate
      # types), and vendor/tiny_http's lib sets `doctest = false` on purpose —
      # its one doc example needs the dropped dev-dependency `rustc-serialize`
      # (vendor/tiny_http/PATCHES.md). `cargo test --doc` ignores that flag and
      # tries to compile it anyway, so don't pass `--doc` for this group.
      - name: test (ffi + duckext + vendored tiny_http)
        run: cargo nextest run --locked -p anofox_viz_ffi -p anofox-visualization-duckdb -p tiny_http

      - name: C-API extension smoke test (render, NULL, errors)
        run: SKIP_WASM=1 OUT="$RUNNER_TEMP/anofox_visualization.duckdb_extension" duckext/scripts/build-native.sh

      - name: Locked server end to end (read-only session, search_path, limits)
        run: duckext/scripts/test-locked-server.sh "$RUNNER_TEMP/anofox_visualization.duckdb_extension"

      - name: Check button on a live (authoring) backend (#199)
        run: duckext/scripts/test-check-live.sh "$RUNNER_TEMP/anofox_visualization.duckdb_extension"

      # #611 CI gap: these two ran by hand only until now — the only
      # end-to-end coverage of ::SUBMIT read-back (plan §5) and the
      # Appender-based viewer_state seeding (#600) was a developer's own
      # local run, never CI.
      - name: Submit/read-back state end to end (plan §5, #517 S3)
        run: duckext/scripts/test-state.sh "$RUNNER_TEMP/anofox_visualization.duckdb_extension"

      - name: Submit live e2e (auth, rate limits, credential locks)
        run: duckext/scripts/test-submit-live.sh "$RUNNER_TEMP/anofox_visualization.duckdb_extension"

      - name: Opt-in assets route on a live (authoring) backend (#522)
        run: duckext/scripts/test-authoring-assets.sh "$RUNNER_TEMP/anofox_visualization.duckdb_extension"

      # #357: the access policy's hash-mask key never reaches a panel, an
      # error, the dashboard page, /healthz, stderr or the request log, and
      # SQL that could reveal it is refused at start.
      - name: Access policy key e2e (hash mask key never leaks)
        run: duckext/scripts/policy-key-e2e.sh "$RUNNER_TEMP/anofox_visualization.duckdb_extension"

      # The Python helper (python/), the snippets of docs/python-r.md and the
      # example notebook (examples/python), rendered through the extension
      # built above.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Python helper + docs snippets (pytest)
        working-directory: python
        env:
          ANOFOX_VIZ_EXTENSION: ${{ runner.temp }}/anofox_visualization.duckdb_extension
        run: |
          pip install "duckdb==1.5.6" -e ".[test]" pingouin lifelines statsforecast nbclient ipykernel
          pytest -q -rs

  sqllogictest:
    # #491: test/sql/*.test (the sqllogictests for the C++ ABI build, `make
    # test`) used to only run inside MainDistributionPipeline's full
    # cross-platform matrix, which #465 moved to the full lane — so a fast
    # lane PR that changed rendering output could merge without ever running
    # them (#487 did, briefly breaking test/sql/anofox_diagram.test on
    # master; fixed by #490). This builds just the linux_amd64 slice (no
    # vcpkg deps — see MainDistributionPipeline.yml's comment) with `make
    # test` directly, instead of going through extension-ci-tools' reusable
    # distribution workflow, and runs parallel to the other fast-lane jobs.
    # ccache (compiled objects) + Swatinem/rust-cache (the corrosion-built
    # anofox_viz_ffi staticlib) keep repeat runs well under the fast lane's
    # ~10 min budget; a cold cache (first run, or duckdb/corrosion bumped) is
    # the slow case.
    name: sqllogictest (linux_amd64, make test)
    needs: lane
    if: needs.lane.outputs.full == 'true' || needs.lane.outputs.docs_only != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sqllogictest

      - name: Install ninja
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ninja-build

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: sqllogictest-linux-amd64
          max-size: 2G

      - name: Build the C++ ABI extension (release)
        env:
          GEN: ninja
        run: make release

      - name: make test (test/sql/*.test against the release build)
        env:
          GEN: ninja
        run: make test

  duckdb-2-0-smoke:
    # #352: non-blocking. DuckDB 2.0 LTS shipped 2026-10-21; our release pin
    # (`.duckdb-version`) stays at v1.5.6 until ~2.0.1, but research found the
    # Rust C-API cdylib (C_STRUCT, C-API v1.2.0) built for 1.5.6 loads
    # unchanged on 2.0.0 (research-duckdb-2.0.md). This job builds it fresh
    # against a real 2.0.0 CLI and runs the locked-server end-to-end smoke
    # test, so a future break shows up here without failing CI. The 2.0
    # release asset is named differently (`duckdb-cli-...tar.gz`, not
    # `duckdb_cli-...zip`) — the pinned jobs above keep the old name.
    # #464: full lane only (a full test-suite re-run, not part of the PR
    # fast lane's budget).
    name: DuckDB 2.0 smoke test (Rust C-API cdylib, non-blocking)
    needs: lane
    if: needs.lane.outputs.full == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cache DuckDB CLI (2.0.0)
        uses: actions/cache@v4
        with:
          path: ~/.local/duckdb-2.0.0
          key: duckdb-cli-2.0.0-linux-amd64

      - name: Install DuckDB CLI (2.0.0)
        run: |
          d="$HOME/.local/duckdb-2.0.0"
          if [ ! -x "$d/duckdb" ]; then
            mkdir -p "$d"
            curl -fsSL --retry 3 -o duckdb.tar.gz https://github.com/duckdb/duckdb/releases/download/v2.0.0/duckdb-cli-linux-amd64.tar.gz
            tar -xzf duckdb.tar.gz -C "$d"
            chmod +x "$d/duckdb"
          fi
          "$d/duckdb" --version
          echo "$d" >> "$GITHUB_PATH"

      # #357: the access policy's rewrite (src/host/policy.rs) depends on
      # `json_serialize_sql`'s exact shape, which 2.0's PEG parser changed;
      # this runs tests/policy_duckdb.rs (and `every_duckdb_function_is_
      # classified`, which fails if 2.0 adds a function src/host/
      # policy_functions.txt doesn't yet classify) against the real 2.0 CLI
      # now first on PATH, alongside the rest of the suite.
      - name: test (core incl. serve and the access policy suite), against DuckDB 2.0
        run: cargo test --locked --features serve

      - name: Build the C-API extension (Rust cdylib)
        run: SKIP_WASM=1 OUT="$RUNNER_TEMP/anofox_visualization.duckdb_extension" duckext/scripts/build-native.sh

      - name: Locked server end to end, against DuckDB 2.0
        run: duckext/scripts/test-locked-server.sh "$RUNNER_TEMP/anofox_visualization.duckdb_extension"

      - name: Check button on a live (authoring) backend, against DuckDB 2.0 (#199)
        run: duckext/scripts/test-check-live.sh "$RUNNER_TEMP/anofox_visualization.duckdb_extension"

      - name: Submit/read-back state end to end, against DuckDB 2.0
        run: duckext/scripts/test-state.sh "$RUNNER_TEMP/anofox_visualization.duckdb_extension"

      - name: Submit live e2e, against DuckDB 2.0
        run: duckext/scripts/test-submit-live.sh "$RUNNER_TEMP/anofox_visualization.duckdb_extension"

      - name: Opt-in assets route on a live (authoring) backend, against DuckDB 2.0 (#522)
        run: duckext/scripts/test-authoring-assets.sh "$RUNNER_TEMP/anofox_visualization.duckdb_extension"

      - name: Access policy key e2e, against DuckDB 2.0
        run: duckext/scripts/policy-key-e2e.sh "$RUNNER_TEMP/anofox_visualization.duckdb_extension"

  web-build:
    # Builds the wasm package once (#464) so the sharded test jobs and the
    # e2e job below don't each pay for it. Also the only place the assist
    # function lists are checked and the dashboard CLI is built — both are
    # shared downstream via the `web-build` artifact.
    name: web build (wasm + dashboard CLI)
    needs: lane
    if: needs.lane.outputs.full == 'true' || needs.lane.outputs.docs_only != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      # Full history + tags: tests/web/version_test.mjs checks the footer's build version (#216).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # #493: a release tag can land on this same commit while this job is
      # still running (pushing to master, which triggers this run, and tagging
      # it `vYYYY.MM.DD` are two separate steps of the release). Capturing the
      # exact `git describe` build.rs will see *now*, in this checkout, and
      # shipping it alongside the wasm build means every later job compares
      # against the describe this wasm was actually built with — not a fresh
      # `git describe` of its own that might run after the tag shows up.
      - name: Capture the build's git describe (for version_test.mjs)
        run: |
          git describe --tags --match 'v*' --long --dirty --abbrev=7 \
            > .build-describe.txt 2>/dev/null || true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the wasm package (web/pkg)
        run: wasm-pack build --target web --out-dir web/pkg --profile wasm --no-default-features --features wasm

      # web/wasm-size.txt + 30 KB (#312). Only meaningful because the build
      # above uses [profile.wasm] (fat LTO, one codegen unit) — see that
      # script's header comment.
      - name: wasm bundle size is within budget
        run: node scripts/check-wasm-size.mjs --check

      - name: Install DuckDB-Wasm (tests/web)
        run: npm install --prefix tests/web --no-audit --no-fund

      - name: Fetch the anofox DuckDB-Wasm extensions (web/localext)
        run: |
          for i in 1 2 3; do scripts/fetch-wasm-extensions.sh && break; echo "fetch attempt $i failed; retrying"; sleep 10; done

      # The assistant's function lists (web/assist/functions.js) come from the
      # pinned builds (scripts/wasm-extensions.lock); after a bump, run
      # node scripts/gen-assist-functions.mjs, review what it prints, commit.
      - name: The assistant's function lists are current
        run: node scripts/gen-assist-functions.mjs --check

      - name: Build the dashboard CLI
        run: cargo build --locked --bin dashboard

      - name: Upload web/pkg, web/localext, the dashboard CLI and the build describe
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            web/pkg
            web/localext
            target/debug/dashboard
            .build-describe.txt
          retention-days: 1

  web-mjs-shard:
    # tests/web/*.mjs sharded 4-way (#464): app.js against the wasm build —
    # table formatting vectors, locale, contract plots, SVG attributes,
    # sanitising, the .xlsx writer and the DuckDB-Wasm extension smoke test.
    # A test that skips (a missing web/pkg, DuckDB-Wasm or wasm extension)
    # fails the shard, so the wasm parts always run here.
    # (tests/web/lint_test.mjs compares the browser's Check with the CLI's,
    # so this shard also needs the pinned DuckDB CLI and the dashboard CLI.)
    name: web tests shard ${{ matrix.shard }}/4
    needs: [lane, web-build]
    if: needs.lane.outputs.full == 'true' || needs.lane.outputs.docs_only != 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      # Full history + tags, mainly so a non-CI run of version_test.mjs here
      # (or any other git-describe-ing test) still works; the version check
      # itself now reads the web-build artifact's .build-describe.txt (#493)
      # rather than re-running `git describe` against this (later, possibly
      # post-tag) checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download web/pkg, web/localext and the dashboard CLI
        uses: actions/download-artifact@v4
        with:
          name: web-build

      - name: Dashboard CLI is executable
        run: chmod +x target/debug/dashboard

      - name: Install DuckDB-Wasm (tests/web)
        run: npm install --prefix tests/web --no-audit --no-fund

      - name: Cache DuckDB CLI (pinned)
        uses: actions/cache@v4
        with:
          path: ~/.local/duckdb-1.5.6
          key: duckdb-cli-1.5.6-linux-amd64

      - name: Install DuckDB CLI (pinned)
        run: |
          d="$HOME/.local/duckdb-1.5.6"
          if [ ! -x "$d/duckdb" ]; then
            mkdir -p "$d"
            curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
            unzip -q duckdb.zip -d "$d"
            chmod +x "$d/duckdb"
          fi
          "$d/duckdb" --version
          echo "$d" >> "$GITHUB_PATH"

      # Deterministic, index-mod-4 split of the sorted file list — every file
      # lands in exactly one shard, so the "no skips" grep check below still
      # covers all of tests/web/*.mjs across the 4 shards.
      - name: Run this shard's tests/web/*.mjs (no skips)
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          status=0
          i=0
          for t in $(ls tests/web/*.mjs | sort); do
            if [ $(( i % 4 )) -eq "$SHARD" ]; then
              echo "== $t"
              out=$(node "$t" 2>&1) || { echo "$out"; echo "::error file=$t::failed"; status=1; i=$((i+1)); continue; }
              echo "$out"
              if echo "$out" | grep -qi 'skip'; then echo "::error file=$t::skipped a part"; status=1; fi
            fi
            i=$((i+1))
          done
          exit $status

  web-e2e:
    # The browser e2e scripts (scripts/*-e2e.mjs): kept in one job (#464) —
    # they share the :8947 server and Chromium, and splitting them by area
    # would mean path-filtering each one individually without actually
    # shortening the lane (they're already the fast part next to the sharded
    # tests/web/*.mjs and the full lane's Explore-starters check).
    name: web e2e (browser)
    needs: [lane, web-build]
    if: needs.lane.outputs.full == 'true' || needs.lane.outputs.docs_only != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # For the served (locked-server) e2e checks further down (#590): they
      # need a native extension build with the *real* UI embedded, unlike
      # the `rust` job's SKIP_WASM=1 one. build-native.sh's SKIP_WASM=1 only
      # skips re-running wasm-pack — include_dir! (duckext/src/serve.rs)
      # still embeds whatever is already in web/pkg, so this stays a plain
      # cdylib build (no wasm toolchain needed here).
      # #616/#618 follow-up: #618 gave this build its own CARGO_TARGET_DIR,
      # set AFTER the web-build artifact download placed target/debug/
      # dashboard, to keep Swatinem/rust-cache's restore away from it. That
      # didn't work — Swatinem/rust-cache's `workspaces` input (what it
      # actually caches/restores) defaults to "<repo-root> -> target" by
      # convention; it ignores CARGO_TARGET_DIR entirely and still
      # restores/saves `<repo>/target` regardless, so its restore still
      # clobbered target/debug/dashboard on a partial cache hit (#612's
      # Cargo.lock bump). `workspaces:` can be told a different target dir,
      # but only a path RELATIVE to the workspace root (the action's own
      # README), so there is no way to point it at $RUNNER_TEMP from here.
      # Simpler and actually effective: move the whole toolchain/cache setup
      # BEFORE the artifact download, so by the time Swatinem/rust-cache
      # restores anything into `<repo>/target`, target/debug/dashboard does
      # not exist yet to be clobbered — it lands fresh right after, and
      # nothing touches `target/` again until Swatinem's own save at job
      # end, well after site-e2e.mjs is done with it. No separate
      # CARGO_TARGET_DIR needed any more: this build can share the same
      # `target/` fine now that the ordering is the other way round. Bumped
      # shared-key too (not reusing #618's cache entries, saved from the
      # wrong ordering).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: web-e2e-served-ext-v2

      - name: Download web/pkg, web/localext and the dashboard CLI
        uses: actions/download-artifact@v4
        with:
          name: web-build

      - name: Dashboard CLI is executable
        run: chmod +x target/debug/dashboard

      - name: Install DuckDB-Wasm (tests/web)
        run: npm install --prefix tests/web --no-audit --no-fund

      # scripts/telemetry-e2e.mjs (#334): no visitor's browser reports usage to
      # a third party. Playwright itself came from tests/web's npm install
      # above (tests/web/package.json devDependencies); only its Chromium
      # binary is cached here.
      - name: Cache Playwright's browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('tests/web/package.json') }}

      - name: Install Playwright's Chromium
        working-directory: tests/web
        run: npx playwright install --with-deps chromium

      - name: Serve web/ for the browser e2e checks
        run: |
          nohup python3 serve_nocache.py 8947 > "$RUNNER_TEMP/serve_nocache.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/serve_nocache.pid"
          for i in $(seq 1 30); do curl -fs -o /dev/null http://127.0.0.1:8947/ && break; sleep 0.5; done
          curl -fs -o /dev/null http://127.0.0.1:8947/ || { echo "::error::serve_nocache.py on :8947 never came up"; cat "$RUNNER_TEMP/serve_nocache.log"; exit 1; }

      # --selftest makes the page also try a PostHog request, which the harness
      # must record and abort — proving it would have caught a real one.
      - name: Telemetry e2e selftest (must fail on the PostHog probe)
        run: |
          if NODE_PATH="$PWD/tests/web/node_modules" node scripts/telemetry-e2e.mjs --url http://127.0.0.1:8947/ --selftest; then
            echo "::error::--selftest should fail on its PostHog probe but exited 0"
            exit 1
          fi
          echo "selftest correctly caught and aborted the telemetry probe"

      - name: Telemetry e2e (no request to a telemetry or unexpected host)
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/telemetry-e2e.mjs --url http://127.0.0.1:8947/

      # scratchRunner's timeout against a real, uncancelled-looking query
      # in the real DuckDB-Wasm Worker (#258, a follow-up to #200): the
      # unit tests (tests/web/lint_test.mjs) prove the cleanup logic with a
      # mock connection; this proves DuckDB-Wasm actually honours the
      # cancel and the page database works again right after.
      - name: Scratch cancel e2e (a late query is really cancelled in the Worker)
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/scratch-cancel-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/toolbar-e2e.mjs (#354 follow-up): ::TOOLBAR's per-part gating
      # in a real browser (totals row vs its toggle button, excluded parts'
      # saved search/filter/hidden-column state, the Pages|Scroll segment,
      # the hover ⤓ CSV fallback and its ::SPARKLINE false-positive, the
      # 'none' + multi-select chip exception) — reuses the :8947 server and
      # Chromium above.
      - name: Table toolbar e2e (::TOOLBAR gating)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/toolbar-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/astables-e2e.mjs (#401): "Charts as tables" is opt-in — off
      # by default with no in-page bar, the toolbar's ⋯ menu item reaches it
      # either way (bar or no bar) and stays in sync with the bar's own
      # button, and `-- @astables on` (not `off`/an unrecognized value)
      # shows the bar. Reuses the :8947 server and Chromium above.
      - name: Charts-as-tables opt-in e2e (#401)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/astables-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/markdown-style-e2e.mjs (#536): ::MARKDOWN_STYLE's three
      # chrome classes (default 'callout' = today's tinted box, 'plain' = no
      # card/tint/bar, 'card' = a bare card), an explicit style winning even
      # over ::CALLOUT, the dashboard's own `-- @markdown_style` default,
      # dark mode keeping the same classes, and no overflow at 1440/390 px.
      - name: Markdown style chrome e2e (#536)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/markdown-style-e2e.mjs --url http://127.0.0.1:8947/

      # The downloaded HTML's tab/sub-tab switcher (#381, an owner-reported
      # regression): exports a dashboard with tabs and sub-tabs and clicks
      # through every one in the downloaded file, offline.
      - name: Sub-tabs export e2e (every ::TAB / ::SUBTAB page in the downloaded HTML)
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/subtabs-export-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/fit-e2e.mjs (#400): a 'fit'::FIT tab fills the window with no
      # page scroll at 1920x1080 / 1366x768 / 3840x2160, its charts redrawn
      # at their fitted pixel size (not stretched); a tab without ::FIT, an
      # overloaded ::FIT tab (fallback + notice), ?fit=0 / ?fit=1, a resize
      # and a cross-filter re-run — reuses the :8947 server and Chromium above.
      - name: Fit-to-screen e2e (::FIT tabs)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/fit-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/show-if-e2e.mjs (#515): on web/examples/onboarding-quiz.sql,
      # a ::SHOW_IF panel is absent until its condition holds, the URL gains
      # ?v.<name>=, a reload shows it immediately, a ::BUTTONS switch swaps
      # two ::SHOW_IF ::GROUP boxes, focus stays on the dropdown, and 390px
      # has no horizontal scroll — reuses the :8947 server and Chromium above.
      - name: ::SHOW_IF e2e (#515)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/show-if-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/steps-e2e.mjs (#516): on web/examples/onboarding-tutorial.sql,
      # the strip reads "Step n of N", Next is gated until a quiz is answered
      # correctly, a URL/seed past a closed gate clamps back to it, the step
      # list and Back/Next navigate, the keyboard alone completes it, 390px
      # has no horizontal scroll, and the ⤓ HTML export shows every step
      # flattened in order — reuses the :8947 server and Chromium above.
      - name: ::GUIDE_STEP e2e (#516)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/steps-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/tour-e2e.mjs (#518 PR B): on web/examples/supply-chain.sql's
      # `amplify_tour`, `?tour=<id>` starts it ("1 of 4", a centred `page`
      # step), Next/Back open whichever tab a step's target sits in and the
      # ring tracks it, Esc ends the tour and returns focus, the toolbar's
      # Tour button starts it, an unknown target is skipped, a cross-filter
      # re-run keeps the ring on the re-rendered target, 390px is a bottom
      # sheet with no horizontal scroll, `-- @tour_autostart` fires once (not
      # again on reload), and garbage `?tour=` does nothing — reuses the
      # :8947 server and Chromium above.
      - name: Guided tour e2e (#518)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/tour-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/dropdown-search-e2e.mjs (#411): above ~50 options (or forced
      # by 'search'/'native'::DROPDOWN_STYLE) a ::DROPDOWN renders a
      # searchable combobox — filtering by value/::OPTION_LABEL, Arrow keys +
      # Enter, Esc / an outside click, a 2,000-option window, and the
      # downloaded HTML snapshot's native <select> fallback.
      - name: Searchable ::DROPDOWN e2e (#411)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/dropdown-search-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/setvar-order-e2e.mjs (#416): a dashboard's own `SET
      # VARIABLE` that reads an input via getvariable() sees the viewer's
      # CURRENT pick, whether it is declared before or after that input in
      # the script — a Share link's first load and a later pick, in a real
      # browser. Reuses the :8947 server and Chromium above.
      - name: SET VARIABLE order e2e (#416)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/setvar-order-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/image-e2e.mjs (#514): ::IMAGE / ::IMAGE_DARK / markdown
      # ![alt](src) images — a data: SVG panel's alt/caption, the dashboard's
      # own dark toggle (not the OS setting) swapping ::IMAGE_DARK in, an
      # inline markdown image, a rejected src drawing the alt-text
      # placeholder with no network request, ::HEIGHT staying fixed and
      # contained, no overflow at 390px, and the offline ⤓ HTML export.
      # Reuses the :8947 server and Chromium above.
      - name: Image panel e2e (::IMAGE, #514)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/image-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/compact-kpi-e2e.mjs (#405): 'compact'::KPI_SIZE on a ::GROUP
      # packs its tiles onto one line each, well under the normal ~96px
      # floor, a tile's own ::KPI_SIZE overriding the box's; ::THRESHOLDS
      # still colours the value; ::FIT gives a compact tile its own, lower
      # floor. Reuses the :8947 server and Chromium above.
      - name: Compact KPI tiles e2e (::KPI_SIZE 'compact')
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/compact-kpi-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/input-options-order-e2e.mjs (#428): an input's OPTIONS query
      # that reads another input's variable sees that other input's CURRENT
      # value, not a run-stale one — whether it is declared before or after
      # that input in the script; and a pick that falls out of its own,
      # narrower, options falls back to the first remaining one. The locked
      # server side (unconditional, not just stale — a fresh connection per
      # request never gets a second chance) is covered separately by
      # scripts/input-options-order-served-e2e.mjs, run further down this
      # job against the native extension built below (#590).
      # Reuses the :8947 server and Chromium above.
      - name: Input OPTIONS query order e2e (#428)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/input-options-order-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/map-geom-sf-e2e.mjs (#459, slice 1 of #420): an eligible
      # ::MAP panel's data-*/<title> contract, hover tooltip, click-to-filter
      # (cross-filters a dependent panel like every other chart) and
      # scroll-to-zoom all still work once the panel is a real GGPlot
      # rendered through geom_sf, not our own hand-written SVG.
      - name: Map geom_sf interaction e2e (#459)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/map-geom-sf-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/map-spark-e2e.mjs (M3b, #642): a list ::SPARKLINE/::SPARKBAR
      # next to a map is a tooltip trend (render_cell mini chart + the
      # data-trend line), not the map's measure; a time map's follows the frame.
      - name: Map tooltip trend e2e (::SPARKLINE on a map, #642)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/map-spark-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/map-tools-e2e.mjs (M3d, #643): wheel zoom about the pointer
      # (data-viewport), double-click zoom-to-feature / reset, the reset
      # chip, zoom to selection, find a place, + − 0 keys, zoom limits,
      # a ::SYNC_ZOOM partner.
      - name: Map zoom tools e2e (#643)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/map-tools-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/sparkbar-e2e.mjs (#425, 50px-floor follow-up #457): a
      # table's ::SPARKBAR cell draws through the wasm render_cell export
      # (ggplot-rs marks, not hand-written SVG, #453 review) for both the
      # single-series and ref/cur-pair forms, and its drawn content fits
      # inside the cell's own box, not clipped or letterboxed.
      - name: Table ::SPARKBAR cell e2e (#425)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/sparkbar-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/sparkline-e2e.mjs (#454): a table's ::SPARKLINE cell draws
      # through the wasm render_cell export (ggplot-rs marks, not
      # hand-written SVG, the same #425/#453 migration) for a zigzag and a
      # flat series, its whole-series summary tip (first → last / min / max
      # / count) still intact as the svg's own <title>, and its drawn
      # content fits inside the cell's own box, not clipped or letterboxed.
      - name: Table ::SPARKLINE cell e2e (#454)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/sparkline-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/view-col-width-e2e.mjs (#470): a chart inside a ::VIEW group
      # that sits in an n::COL slot lays out (its svg viewBox) at the slot's
      # own width, the same as a panel outside the view — not at full width,
      # scaled down afterwards (half the height, half-size text).
      - name: ::VIEW group ::COL width e2e (#470)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/view-col-width-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/view-height-e2e.mjs (#573): a ::HEIGHT pending before a
      # ::VIEW group's first marker must apply to every alternative, not
      # just the first (the card jumped in height when switching) — an
      # alternative's own ::HEIGHT still wins. ::COL's own twin, above.
      - name: ::VIEW group ::HEIGHT e2e (#573)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/view-height-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/mini-charts-e2e.mjs (#463): Explore data's card histogram
      # (xpMini, both its histogram and rows-over-time-line branches), its
      # A/B distribution overlay (xpOverlay) and the table's own
      # column-profile histogram (st-hist) all draw through the wasm
      # renderer (ggplot-rs marks, not hand-written SVG) — the same
      # #425/#453/#454 migration, folded into the app's remaining
      # hand-drawn mini charts.
      - name: Explore/table mini-chart e2e (#463)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/mini-charts-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/view-placement-e2e.mjs (#534): opt-in 'header'::VIEW_PLACEMENT
      # moves a ::VIEW group's switcher into the shown card's own title row
      # (right-aligned, the title wrapping first) instead of its own row
      # above it — only when every alternative is one panel, else it stays
      # 'row' untouched; below a minimum card width it folds into a
      # labelled <select>; arrow-key navigation and focus-on-swap still
      # work. Reuses the :8947 server and Chromium above.
      - name: ::VIEW_PLACEMENT header e2e (#534)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/view-placement-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/points-e2e.mjs (#631): a dense line's markers are uninked
      # hover targets (crosshair tooltip, ::LINK click still work); a short
      # series keeps its dots; ::POINTS overrides both ways.
      - name: Dense line markers e2e (::POINTS, #631)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/points-e2e.mjs --url http://127.0.0.1:8947/

      # scripts/frames-e2e.mjs (M2f-A, #149): the live ::FRAME player — step,
      # slider, Play/Pause, reduced motion, zoom + step, as-table, the
      # export's note, axe, and the perf budget (p95 draw(k) <= 150ms).
      - name: ::FRAME player e2e (M2f-A, #149)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/frames-e2e.mjs --url http://127.0.0.1:8947/ --out /tmp/frames-e2e-shots

      # scripts/frames-export-e2e.mjs (M2f-B, #149): the HTML export embeds
      # every frame of a time map within budget and rebuilds a swap-only
      # player offline (no server, no wasm) — step/slider/Play, hover on
      # the swapped-in marks, shared legend classes, ::FIT, dark mode, a
      # non-last starting frame, and the over-budget note fallback.
      - name: ::FRAME export e2e (M2f-B, #149)
        timeout-minutes: 10
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/frames-export-e2e.mjs --url http://127.0.0.1:8947/

      - name: Stop the web/ server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/serve_nocache.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/serve_nocache.pid")" 2>/dev/null || true
          fi

      - name: Cache DuckDB CLI (pinned)
        uses: actions/cache@v4
        with:
          path: ~/.local/duckdb-1.5.6
          key: duckdb-cli-1.5.6-linux-amd64

      - name: Install DuckDB CLI (pinned)
        run: |
          d="$HOME/.local/duckdb-1.5.6"
          if [ ! -x "$d/duckdb" ]; then
            mkdir -p "$d"
            curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
            unzip -q duckdb.zip -d "$d"
            chmod +x "$d/duckdb"
          fi
          "$d/duckdb" --version
          echo "$d" >> "$GITHUB_PATH"

      # scripts/site-e2e.mjs (#417 A4, PR #429 review): `dashboard --site`'s
      # published static site, in a real browser, served under a GitHub-
      # Pages-style /repo/ sub-path by a plain static server this script
      # starts itself (no locked server, no builder) — nav + nav_picker
      # render, an in-place nav switch survives a window marker (no full
      # reload), a hard reload of /d/<id>/ and back/forward all work, the
      # parquet data reads for real, a `../x` path_vars value is dropped
      # (#417 S2), no editor flash, and no request leaves this site's own
      # origin / the pinned CDN hosts. Reuses the dashboard CLI and DuckDB
      # CLI built/installed above.
      - name: Published static site e2e (dashboard --site)
        timeout-minutes: 5
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/site-e2e.mjs --dashboard target/debug/dashboard

      # scripts/served-e2e.mjs / scripts/input-options-order-served-e2e.mjs
      # (#590): the browser e2e checks that need a real locked server
      # (anofox_serve_dashboards), not the :8947 static serve_nocache.py
      # above — a native extension build, with the real UI embedded (the
      # Rust toolchain + web/pkg from earlier in this job). `SKIP_WASM=1`
      # here just means "don't re-run wasm-pack", not "no UI": include_dir!
      # embeds whatever is already in web/pkg. Uses the DuckDB CLI installed
      # above.
      - name: Build the native extension with the real UI embedded (#590)
        run: |
          touch duckext/src/serve.rs   # force include_dir! to re-embed the downloaded web/pkg
          SKIP_WASM=1 OUT="$RUNNER_TEMP/anofox_visualization.duckdb_extension" duckext/scripts/build-native.sh

      - name: Served dashboards e2e (locked server, real UI, #590)
        timeout-minutes: 5
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/served-e2e.mjs --ext "$RUNNER_TEMP/anofox_visualization.duckdb_extension"

      - name: Input OPTIONS query order e2e, served (locked server, #428/#590)
        timeout-minutes: 5
        run: NODE_PATH="$PWD/tests/web/node_modules" node scripts/input-options-order-served-e2e.mjs --ext "$RUNNER_TEMP/anofox_visualization.duckdb_extension"

  web-explore-starters:
    # Explore data's starter dashboards (#97): every sample table's starter
    # passes `dashboard --check --strict` (profiled with web/explore.js and
    # the wasm page_sql, linted against the native DuckDB CLI). #464: this is
    # the ~4.5 min strict check that only needs to run in the full lane.
    name: Explore starter dashboards --check --strict
    needs: [lane, web-build]
    if: needs.lane.outputs.full == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download web/pkg, web/localext and the dashboard CLI
        uses: actions/download-artifact@v4
        with:
          name: web-build

      - name: Dashboard CLI is executable
        run: chmod +x target/debug/dashboard

      - name: Install DuckDB CLI (pinned)
        run: |
          d="$HOME/.local/duckdb-1.5.6"
          mkdir -p "$d"
          curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip -d "$d"
          chmod +x "$d/duckdb"
          echo "$d" >> "$GITHUB_PATH"

      - name: Explore starter dashboards pass --check --strict
        run: |
          # the hints' anofox_tabular checks run when the extension installs (#111)
          duckdb -c "INSTALL anofox_tabular FROM community" || echo "anofox_tabular not installed"
          node scripts/explore-starters.mjs --dashboard target/debug/dashboard --out "$RUNNER_TEMP/explore-starters"

  statistics-conformance:
    # Every anofox-statistics contract producer (141 functions: tagged
    # anofox.contract = '1') → anofox_plot(...) and its specific macro, on the
    # C-API build. DuckDB is pinned to v1.5.6 (get.erpl.io serves stale
    # anofox_statistics builds for older DuckDB releases).
    # #464: full lane only — it installs anofox_statistics from a live
    # network source (get.erpl.io), not just ~1 min of local work.
    name: anofox-statistics conformance
    needs: lane
    if: needs.lane.outputs.full == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install DuckDB CLI v1.5.6
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/duckdb"
          "$HOME/.local/bin/duckdb" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install anofox_statistics from get.erpl.io
        run: |
          for i in 1 2 3; do
            duckdb -unsigned -c "FORCE INSTALL anofox_statistics FROM 'https://get.erpl.io'" && break
            echo "install attempt $i failed; retrying"; sleep 10
          done
          duckdb -unsigned -c "LOAD anofox_statistics;
            SELECT extension_version FROM duckdb_extensions() WHERE extension_name = 'anofox_statistics';
            SELECT CASE WHEN anofox_contract_version() = '1' THEN 'contract 1'
                        ELSE error('anofox_statistics implements contract ' || anofox_contract_version() || ', expected 1') END;"

      - name: Build the C-API extension
        run: SKIP_WASM=1 OUT="$RUNNER_TEMP/anofox_visualization.duckdb_extension" duckext/scripts/build-native.sh --release

      - name: Conformance (every producer → anofox_plot + specific macro)
        run: |
          python3 scripts/statistics_conformance.py --duckdb duckdb \
            --ext "$RUNNER_TEMP/anofox_visualization.duckdb_extension" \
            --out "$RUNNER_TEMP/statistics-conformance" --jobs 4 --no-montage

      - name: Upload the SVGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statistics-conformance-svgs
          path: ${{ runner.temp }}/statistics-conformance
          if-no-files-found: ignore

  optimize-conformance:
    # Every anofox-optimize solver (38 scalar functions in 8 families; the
    # extension tags none anofox.contract, so the harness discovers them by
    # name and fails on one without a recipe): return type and solution
    # invariants, its objectives through anofox_plot(...) and
    # anofox_plot_summary(...), its decision view through anofox_render. On
    # the C-API build, DuckDB pinned to v1.5.6; anofox_optimize from
    # get.erpl.io (the community repository has no v1.5.6 build of it yet).
    # #464: full lane only (live network install, see statistics-conformance).
    name: anofox-optimize conformance
    needs: lane
    if: needs.lane.outputs.full == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    env:
      DATAZOO_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install DuckDB CLI v1.5.6
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/duckdb"
          "$HOME/.local/bin/duckdb" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install anofox_optimize from get.erpl.io
        run: |
          for i in 1 2 3; do
            duckdb -unsigned -c "FORCE INSTALL anofox_optimize FROM 'https://get.erpl.io'" && break
            echo "install attempt $i failed; retrying"; sleep 10
          done
          duckdb -unsigned -c "LOAD anofox_optimize; SELECT anofox_optimize_version();"

      - name: Build the C-API extension
        run: SKIP_WASM=1 OUT="$RUNNER_TEMP/anofox_visualization.duckdb_extension" duckext/scripts/build-native.sh --release

      - name: Conformance (every solver → anofox_plot + its decision view)
        run: |
          python3 scripts/optimize_conformance.py --duckdb duckdb \
            --ext "$RUNNER_TEMP/anofox_visualization.duckdb_extension" \
            --out "$RUNNER_TEMP/optimize-conformance" --jobs 4 --no-montage

      - name: Upload the SVGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimize-conformance-svgs
          path: ${{ runner.temp }}/optimize-conformance
          if-no-files-found: ignore

  decide-conformance:
    # anofox-decide tags no contract producer yet: every decide output goes
    # through the SQL bridge to a contract schema (metrics → summary,
    # probabilities → ROC / PR / calibration curves) and on to anofox_plot(...)
    # and its specific macro; the raw outputs that no schema takes must fail
    # cleanly; a tagged producer without a recipe fails the job. Answers come
    # from decide's built-in stub model (offline, deterministic). anofox_decide
    # from the community repository (signed), anofox_statistics from get.erpl.io
    # for its curve producers; DuckDB pinned to v1.5.6.
    # #464: full lane only (live network install, see statistics-conformance).
    name: anofox-decide conformance
    needs: lane
    if: needs.lane.outputs.full == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    env:
      DATAZOO_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install DuckDB CLI v1.5.6
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q duckdb.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/duckdb"
          "$HOME/.local/bin/duckdb" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install anofox_decide (community) and anofox_statistics (get.erpl.io)
        run: |
          for i in 1 2 3; do
            duckdb -c "FORCE INSTALL anofox_decide FROM community" && break
            echo "install attempt $i failed; retrying"; sleep 10
          done
          for i in 1 2 3; do
            duckdb -unsigned -c "FORCE INSTALL anofox_statistics FROM 'https://get.erpl.io'" && break
            echo "install attempt $i failed; retrying"; sleep 10
          done
          duckdb -c "LOAD anofox_decide;
            SELECT extension_version FROM duckdb_extensions() WHERE extension_name = 'anofox_decide';"

      - name: Build the C-API extension
        run: SKIP_WASM=1 OUT="$RUNNER_TEMP/anofox_visualization.duckdb_extension" duckext/scripts/build-native.sh --release

      - name: Conformance (every decide output → anofox_plot + specific macro)
        run: |
          python3 scripts/decide_conformance.py --duckdb duckdb \
            --ext "$RUNNER_TEMP/anofox_visualization.duckdb_extension" \
            --out "$RUNNER_TEMP/decide-conformance" --statistics yes --jobs 4 --no-montage

      - name: Upload the SVGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decide-conformance-svgs
          path: ${{ runner.temp }}/decide-conformance
          if-no-files-found: ignore

  tabular-conformance:

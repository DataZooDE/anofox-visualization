name: Build full-toolkit extension (C-API)

# Build + package the C-API anofox_visualization extension (render + serving,
# duckext/) for each platform and upload the loadable `.duckdb_extension`
# artifacts. Mirrors duckext/scripts/build-native.sh. Builds from a clean
# checkout: the DuckDB C-API header is vendored (duckext/capi_hdr), web/pkg is
# built with wasm-pack before the extension embeds it, and ggplot-rs is a
# pinned git dependency resolved through the committed Cargo.lock (--locked).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux_amd64,   lib: libanofox_visualization_ext.so }
          - { os: macos-14,       name: osx_arm64,     lib: libanofox_visualization_ext.dylib }
          - { os: macos-15-intel, name: osx_amd64,     lib: libanofox_visualization_ext.dylib }
          - { os: windows-latest, name: windows_amd64, lib: anofox_visualization_ext.dll }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DuckDB (Python, pinned) for the smoke test
        run: python -m pip install --quiet "duckdb==1.5.*"

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build web/pkg (embedded builder UI)
        run: wasm-pack build --target web --out-dir web/pkg --no-default-features --features wasm

      - name: Build (release cdylib)
        run: cargo build --locked --release -p anofox-visualization-duckdb --lib

      - name: Package (metadata footer)
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          python duckext/scripts/append_extension_metadata.py -l "target/release/${{ matrix.lib }}" \
            -n anofox_visualization -p ${{ matrix.name }} -dv v1.2.0 -ev "v$VERSION" --abi-type C_STRUCT \
            -o anofox_visualization.duckdb_extension

      - name: Smoke test (Python DuckDB, unsigned)
        run: |
          python - <<'PY'
          import duckdb
          con = duckdb.connect(config={"allow_unsigned_extensions": "true"})
          con.execute("LOAD 'anofox_visualization.duckdb_extension'")
          svg = con.execute("""
            WITH d AS (SELECT * FROM (VALUES ('app',30),('web',22)) t(ch,n))
            SELECT anofox_bar(ch, n) FROM d
          """).fetchone()[0]
          assert svg.startswith("<svg") and "<rect" in svg, svg[:80]
          assert con.execute("SELECT anofox_render(NULL)").fetchone()[0] is None
          try:
              con.execute("SELECT anofox_render('not json')").fetchone()
              raise SystemExit("a bad spec must raise an error")
          except duckdb.Error as e:
              assert "bad spec JSON" in str(e), e
          print("OK:", len(svg), "byte SVG")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: anofox_visualization-${{ matrix.name }}
          path: anofox_visualization.duckdb_extension

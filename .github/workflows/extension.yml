name: Release full toolkit

# The from-source FULL TOOLKIT (see BUILD.md) as GitHub release assets, per
# platform:
#   anofox_visualization.<tag>.duckdb-<duckdb>.<platform>.duckdb_extension
#       the C-API extension (duckext/): anofox_render + macros + anofox_serve*
#       with the builder UI (web/pkg, wasm-pack) embedded; unsigned
#   anofox-visualization-cli-<tag>-<rust target>.tar.gz (.zip on Windows)
#       the `dashboard` and `serve` binaries + README.md + LICENSE
#   anofox-visualization-web-<tag>.tar.gz (one platform only — it's pure
#       web/js/wasm, built once: see scripts/release/build-web.sh)
#       web/pkg (wasm-pack) + web/localext (pinned DuckDB-Wasm extensions) +
#       the rest of web/ — `dashboard --site` (#417) embeds it into a
#       published static site; a GitHub Pages workflow fetches it with
#       `gh release download`, same as pages.yml builds the app for its own
#       Pages deploy.
#   SHA256SUMS
# Each platform builds and smoke-tests on its own runner against the DuckDB CLI
# pinned in .duckdb-version. The logic lives in scripts/release/ (runnable
# locally); this file only wires runners to it.
#
# On a `v*` tag (pushed when a GitHub release is published) the assets are
# uploaded to that release; workflow_dispatch builds the same assets as
# workflow artifacts only. pages.yml republishes the extensions as a DuckDB
# custom extension repository after a successful run here.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Empty on workflow_dispatch → the scripts default to v<Cargo.toml version>.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  build:
    name: ${{ matrix.platform }}
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: Ubuntu 22.04 runners so the binaries need only glibc >= 2.35.
          - { os: ubuntu-22.04,     platform: linux_amd64 }
          - { os: ubuntu-22.04-arm, platform: linux_arm64 }
          - { os: macos-14,         platform: osx_arm64 }
          - { os: macos-15-intel,   platform: osx_amd64 }
          - { os: windows-latest,   platform: windows_amd64 }
    defaults:
      run:
        shell: bash
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      # Full history + tags: the binaries and the embedded web/pkg show the
      # build version from git describe — exactly the tag on a release (#216).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag matches the Cargo.toml version
        if: env.RELEASE_TAG != ''
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$RELEASE_TAG" = "v$VERSION" ] || { echo "::error::tag $RELEASE_TAG != v$VERSION (Cargo.toml)"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install the pinned DuckDB CLI
        run: echo "DUCKDB=$(scripts/release/install-duckdb-cli.sh)" >> "$GITHUB_ENV"

      - name: Build + smoke-test the extension (web/pkg, cdylib, metadata)
        run: scripts/release/build-extension.sh

      - name: Build + smoke-test + package the CLI (dashboard, serve)
        run: scripts/release/package-cli.sh

      # Platform-independent (pure web/js/wasm): built once, on this leg only.
      - name: Package the web app (#417 — dashboard --site's --app)
        if: matrix.platform == 'linux_amd64'
        run: scripts/release/build-web.sh

      - uses: actions/upload-artifact@v4
        with:
          name: full-toolkit-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Upload to the GitHub release
    needs: build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: full-toolkit-*
          merge-multiple: true
          path: dist

      - name: SHA256SUMS + upload (release only on a v* tag)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ env.RELEASE_TAG == '' && '1' || '0' }}
        run: scripts/release/upload-release.sh "${RELEASE_TAG:-manual}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS

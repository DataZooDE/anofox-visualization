# The composite action other repositories use to check their dashboards in CI
# (.github/actions/check-dashboards, #772), run against this repository's own
# dashboards/ folder with the latest release. Only when the action changes.
name: check-dashboards action
on:
  pull_request:
    paths: [".github/actions/check-dashboards/**", ".github/workflows/check-dashboards-action.yml"]
  push:
    branches: [master]
    paths: [".github/actions/check-dashboards/**", ".github/workflows/check-dashboards-action.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/check-dashboards
        with:
          folder: dashboards
          # dashboards/ carries design advisories on purpose (demo content).
          strict: "false"

name: Deploy web app to Pages

# Build the wasm module and publish the web/ dashboard app to GitHub Pages.
# web/pkg is gitignored, so it's built here rather than committed.
# Also publishes the latest release's full-toolkit extensions as a DuckDB
# custom extension repository under /extensions (scripts/release/extension-repo.sh):
#   INSTALL anofox_visualization FROM 'https://datazoode.github.io/anofox-visualization/extensions';
# so it also redeploys after "Release full toolkit" (extension.yml) uploaded them.
on:
  push:
    branches: [master]
  workflow_run:
    workflows: ["Release full toolkit"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push supersede an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # anofox extensions send usage telemetry by default; never from CI
  DATAZOO_DISABLE_TELEMETRY: "1"

jobs:
  build:
    # After a release run: only when it succeeded on a v* tag (a manual run
    # uploads no release assets).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build wasm module (→ web/pkg)
        run: wasm-pack build --target web --out-dir web/pkg --no-default-features --features wasm

      # The anofox DuckDB-Wasm extensions, served same-origin from
      # web/localext/ (get.erpl.io has no CORS + needs a signature fix, #192).
      - name: Fetch wasm extensions (→ web/localext)
        run: scripts/fetch-wasm-extensions.sh "$(cat .duckdb-version)"

      # The latest release's native extensions → web/extensions/<duckdb>/<platform>/
      # anofox_visualization.duckdb_extension.gz (a warning, not a failure, when
      # no release has them yet).
      - name: DuckDB extension repository (latest release → web/extensions)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/release/extension-repo.sh --release latest web/extensions

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

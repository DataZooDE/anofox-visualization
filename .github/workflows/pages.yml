name: Deploy web app to Pages

# Build the wasm module and publish the web/ dashboard app to GitHub Pages.
# web/pkg is gitignored, so it's built here rather than committed.
# Also publishes the latest release's full-toolkit extensions as a DuckDB
# custom extension repository under /extensions (scripts/release/extension-repo.sh):
#   INSTALL anofox_visualization FROM 'https://datazoode.github.io/anofox-visualization/extensions';
# so it also redeploys after "Release full toolkit" (extension.yml) uploaded them.
on:
  push:
    branches: [master]
  workflow_run:
    workflows: ["Release full toolkit"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; let a newer push supersede an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # anofox extensions send usage telemetry by default; never from CI
  DATAZOO_DISABLE_TELEMETRY: "1"

jobs:
  build:
    # After a release run: only when it succeeded on a v* tag (a manual run
    # or a release/* branch push uploads no release assets, #653).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      # Full history + tags: the app's footer shows the build version (#216).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      # Same as ci.yml: the rustwasm installer script ships an old wasm-pack
      # that rejects `--profile` next to its implicit `--release` (#316).
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: wasm-pack

      - name: Build wasm module (→ web/pkg)
        run: wasm-pack build --target web --out-dir web/pkg --profile wasm --no-default-features --features wasm

      # The anofox DuckDB-Wasm extensions, served same-origin from
      # web/localext/ (get.erpl.io has no CORS + needs a signature fix, #192).
      # Pinned (scripts/wasm-extensions.lock, #235), so this is now the same
      # build the assistant's function lists (web/assist/functions.js) were
      # generated against.
      - name: Fetch wasm extensions (→ web/localext)
        run: scripts/fetch-wasm-extensions.sh "$(cat .duckdb-version)"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install DuckDB-Wasm (tests/web)
        run: npm install --prefix tests/web --no-audit --no-fund

      - name: The assistant's function lists match the pinned builds
        run: node scripts/gen-assist-functions.mjs --check

      # The latest release's native extensions → web/extensions/<duckdb>/<platform>/
      # anofox_visualization.duckdb_extension.gz (a warning, not a failure, when
      # no release has them yet).
      - name: DuckDB extension repository (latest release → web/extensions)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/release/extension-repo.sh --release latest web/extensions

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web

  deploy:
    permissions:
      pages: write
      id-token: write
    needs: build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

name: Deploy web app to Pages

# Build the wasm module and publish the web/ dashboard app to GitHub Pages.
# web/pkg is gitignored, so it's built here rather than committed.
# Also publishes the latest release's full-toolkit extensions as a DuckDB
# custom extension repository under /extensions (scripts/release/extension-repo.sh):
#   INSTALL anofox_visualization FROM 'https://datazoode.github.io/anofox-visualization/extensions';
# so it also redeploys after "Release full toolkit" (extension.yml) uploaded them.
# Once a release exists, a run whose latest release lacks a complete set of
# extensions FAILS rather than deploy the site without /extensions: the
# previous deployment stays live, and Pages ignores a later redeploy of the
# same commit, so an empty one would stick until the next commit (#1008).
on:
  push:
    branches: [master]
  workflow_run:
    workflows: ["Release full toolkit"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; let a newer push supersede an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # anofox extensions send usage telemetry by default; never from CI
  DATAZOO_DISABLE_TELEMETRY: "1"

jobs:
  build:
    # After a release run: only when it succeeded on a v* tag (a manual run
    # or a release/* branch push uploads no release assets, #653).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    # 15 for the build + up to 10 polling a release that is still uploading.
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      # Full history + tags: the app's footer shows the build version (#216).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      # Same as ci.yml: the rustwasm installer script ships an old wasm-pack
      # that rejects `--profile` next to its implicit `--release` (#316).
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: wasm-pack

      - name: Build wasm module (→ web/pkg)
        run: wasm-pack build --target web --out-dir web/pkg --profile wasm --no-default-features --features wasm

      # The anofox DuckDB-Wasm extensions, served same-origin from
      # web/localext/ (get.erpl.io has no CORS + needs a signature fix, #192).
      # Pinned (scripts/wasm-extensions.lock, #235), so this is now the same
      # build the assistant's function lists (web/assist/functions.js) were
      # generated against.
      - name: Fetch wasm extensions (→ web/localext)
        run: scripts/fetch-wasm-extensions.sh "$(cat .duckdb-version)"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install DuckDB-Wasm (tests/web)
        run: npm install --prefix tests/web --no-audit --no-fund

      - name: The assistant's function lists match the pinned builds
        run: node scripts/gen-assist-functions.mjs --check

      # The latest release's native extensions → site/extensions/<duckdb>/<platform>/
      # anofox_visualization.duckdb_extension.gz. Fails the run (no deploy) when
      # that release lacks SHA256SUMS or any extension it lists, after polling
      # up to EXT_REPO_WAIT seconds in case a release was just (re)created and
      # is still uploading (#1008). Only "no published release at all" (first
      # bootstrap) deploys the app without /extensions.
      # #1017 P0 (D4): the site is the latest release's own web build at /,
      # master's at /next/ (noindex).
      # #1020: the website preview (Astro Starlight) at /next/, master's
      # builder at /next/app/.
      - name: Build the website (→ website/dist)
        working-directory: website
        env:
          SITE_BASE: /anofox-visualization/next
        run: |
          npm ci --no-audit --no-fund
          npm run build
      # #1017 (owner 11-08): the website becomes the main page — built from
      # the latest release's tag at / (its builder at /app/), once that tag
      # has a website/; until then / stays the release's builder.
      - name: Build the release's website (→ release-site/website/dist)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SITE_BASE: /anofox-visualization
        run: |
          tag="$(gh release view --json tagName -q .tagName)"
          git worktree add release-site "$tag"
          if [ -f release-site/website/package.json ]; then
            (cd release-site/website && npm ci --no-audit --no-fund && npm run build)
          else
            echo "release $tag has no website/: / stays its builder"
          fi
      - name: Site (latest release at /, master at /next/)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/release/pages-site.sh web site website/dist release-site/website/dist
      - name: DuckDB extension repository (latest release → site/extensions)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXT_REPO_WAIT: "600"
          EXT_REPO_POLL: "30"
        run: scripts/release/extension-repo.sh --release latest site/extensions

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    permissions:
      pages: write
      id-token: write
    needs: build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

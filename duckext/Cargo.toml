[package]
name = "duckplot-duckext"
version = "0.1.0"
edition = "2021"
description = "DuckDB C-API extension: SELECT ggplot(...) → SVG, rendered by ggplot-rs via duckplot. Wasm side-module compatible (no libduckdb linking)."

[lib]
crate-type = ["cdylib"]

[dependencies]
duckplot = { path = ".." }
ggplot-rs = { path = "../../ggplot-rs", default-features = false }
# duckplot_serve(): embed the browser UI + serve it on the live session.
tiny_http = "0.12"
include_dir = "0.7"
serde_json = "1"
open = "5"

[build-dependencies]
bindgen = "0.70"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

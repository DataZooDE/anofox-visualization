[package]
name = "anofox-visualization"
version = "0.1.0"
edition = "2021"
description = "anofox-visualization: a DuckDB C-API extension — SELECT anofox_render(...) → SVG, rendered by ggplot-rs via duckplot. Wasm side-module compatible (no libduckdb linking)."

[lib]
name = "anofox_visualization"
crate-type = ["cdylib"]

[dependencies]
duckplot = { path = ".." }
ggplot-rs = { path = "../../ggplot-rs", default-features = false }
# duckplot_serve(): embed the browser UI + serve it on the live session.
tiny_http = "0.12"
include_dir = "0.7"
serde_json = "1"
open = "5"

[build-dependencies]
bindgen = "0.70"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

# The DuckDB extension crate. The user-facing extension is still named
# `anofox_visualization` (its .so filename + the `anofox_visualization_init_c_api`
# symbol), but the cargo package/lib are suffixed `-duckdb`/`_ext` so they don't
# collide with the core `anofox-visualization` library it depends on.
[package]
name = "anofox-visualization-duckdb"
version = "0.1.0"
edition = "2021"
description = "DuckDB C-API extension — SELECT anofox_render(...) → SVG via the anofox-visualization renderer. Wasm side-module compatible (no libduckdb linking)."

[lib]
name = "anofox_visualization_ext"
crate-type = ["cdylib"]

[dependencies]
anofox-visualization = { path = ".." }
# Same git rev as the core crate (both must resolve to one ggplot-rs).
ggplot-rs = { git = "https://github.com/sipemu/ggplot-rs", rev = "498aad5a851ea249bf19f14947c3561cf3a4a3e0", default-features = false }
# anofox_serve(): embed the browser UI + serve it on the live session.
tiny_http = "0.12"
include_dir = "0.7"
serde_json = "1"
open = "5"

[build-dependencies]
bindgen = "0.70"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

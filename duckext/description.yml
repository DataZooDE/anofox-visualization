# Descriptor for the duckdb/community-extensions repo. Copy to
#   community-extensions/extensions/anofox_visualization/description.yml
# and open a PR there. See DISTRIBUTING.md.
#
# The community binary is the render-only CMake build at the repository root
# (C++ shell in csrc/ + the Rust staticlib crates/anofox-viz-ffi, built through
# extension-ci-tools with corrosion) — NOT the C-API crate in this directory.
extension:
  name: anofox_visualization
  description: Render charts and dashboards straight from SQL — the ggplot-rs grammar of graphics, emitted as SVG.
  # Keep in sync with [workspace.package] version in the root Cargo.toml.
  version: 2026.9.26
  language: Rust
  build: cmake
  requires_toolchains: rust
  license: BUSL-1.1
  # Same exclusions as .github/workflows/MainDistributionPipeline.yml.
  excluded_platforms: "windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads"
  maintainers:
    - DataZooDE
    - sipemu

repo:
  github: DataZooDE/anofox-visualization
  # The default branch is `master`. When submitting, pin the release commit SHA.
  ref: master

docs:
  hello_world: |
    -- One scalar plus convenience macros. Pass columns; get an SVG per group.
    WITH sales AS (SELECT * FROM (VALUES ('app',30),('web',22),('api',12)) t(ch,n))
    SELECT anofox_bar(ch, n) FROM sales;          -- <svg> bar chart

    -- Any chart kind via anofox_xy(..., kind := ...), or the raw spec:
    SELECT anofox_render('{"rows":[{"c0":"a","c1":3}],"roles":[[0,"XAXIS"],[1,"BARCHART"]]}');
  extended_description: |
    anofox_visualization renders charts as SVG from inside DuckDB, using the
    ggplot-rs grammar-of-graphics engine (via the anofox-visualization core). It exposes:
      - anofox_render(spec VARCHAR) -> VARCHAR  — a JSON panel spec -> SVG
        (NULL -> NULL; an invalid or oversize spec raises an error)
      - anofox_bar / anofox_line / anofox_scatter / anofox_area (x, y)
      - anofox_xy(x, y, kind := 'BARCHART', width := 640, height := 400)
      - anofox_xyc(x, y, series, kind := 'BARCHART_STACKED')
    The convenience macros aggregate rows via list(), so `SELECT anofox_bar(x, y)
    FROM t` returns one SVG for the group. The serving functions (anofox_serve,
    anofox_serve_dashboards) are not part of this binary; see the repository's
    BUILD.md for the full-toolkit build.
